let MODAL_TIPOS=[];      // tipos de reel elegidos en el modal abierto
let MODAL_SNAPSHOT={};   // precios ya congelados de la pieza que se está editando

/** Libera los precios congelados para que se vuelvan a tomar los de hoy. */
function recalcPrecios(){
  MODAL_SNAPSHOT={};
  toast("Se van a usar los precios de hoy al guardar");
  const box=document.querySelector('[data-action="recalcPrecios"]');
  if(box)box.closest("div[style*='surface-2']").innerHTML=
    `<span class="chip" style="background:var(--warn-soft);color:var(--warn)">Se recalcula con precios de hoy al guardar</span>`;
}

/** Marca el estado manual de una pieza en el flujo de Meta Ads. */
function setAdsEstado(id,estado){
  const o=state.contenido.find(c=>c.id===id);if(!o)return;
  o.adsEstado=estado||null;
  DB.upsertContenido(o);
  toast(estado?`Marcado como "${ADS_ESTADOS[estado]?.t||estado}"`:"Vuelve a evaluación automática");
  render();
}

function saveContenido(id){
  const g=x=>document.getElementById(x);
  const gn=x=>Number(g(x).value)||0;
  const ventas={};PRODUCTOS.forEach(p=>ventas[p.id]=gn("m_v_"+p.id));

  // CONGELAR EL PRECIO: la primera vez que una venta de ese producto se registra,
  // se guarda el precio vigente. No se vuelve a tocar aunque el precio cambie después.
  // Si la venta se borra (vuelve a 0), se libera para no dejar un precio huérfano.
  const snap={...(MODAL_SNAPSHOT||{})};
  PRODUCTOS.forEach(p=>{
    const q=ventas[p.id]||0;
    if(q>0&&snap[p.id]==null)snap[p.id]=p.precio;
    if(q===0)delete snap[p.id];
  });

  const data={
    titulo:g("m_titulo").value.trim()||"Sin título",tipo:g("m_tipo").value,canal:g("m_canal").value,
    url:g("m_url").value.trim(),
    producto:g("m_producto").value,framework:g("m_framework").value||"",tipos:[...(MODAL_TIPOS||[])],
    pilar:g("m_pilar").value,estado:g("m_estado").value,fecha:g("m_fecha").value,gastoAnuncio:gn("m_gasto"),
    vistas:gn("m_vistas"),alcance:gn("m_alcance"),likes:gn("m_likes"),comentarios:gn("m_comentarios"),
    guardados:gn("m_guardados"),compartidos:gn("m_compartidos"),seguidoresGanados:gn("m_seguidores"),
    // si cargó vistas o alcance, la pieza YA tiene métricas: no depende de acordarse del tilde
    ventas,preciosSnapshot:snap,
    metricasCargadas:g("m_cargada").checked||gn("m_vistas")>0||gn("m_alcance")>0,
  };
  let o;
  if(id){o=state.contenido.find(x=>x.id===id);Object.assign(o,data);}
  else{o={id:nid(),notas:"",creado:new Date().toISOString(),...data};state.contenido.unshift(o);}
  DB.upsertContenido(o);
  closeModal();render();
}
function delContenidoAct(id){state.contenido=state.contenido.filter(c=>c.id!==id);DB.deleteContenido(id);closeModal();render();}
function saveMeta(id){
  const g=x=>document.getElementById(x);
  const data={titulo:g("mt_titulo").value.trim()||"Sin título",tipo:g("mt_tipo").value,metrica:g("mt_metrica").value,
    objetivo:Number(g("mt_objetivo").value)||1,fechaLimite:g("mt_fecha").value,actual:Number(g("mt_actual")?.value)||0,
    unidad:g("mt_metrica").value==="ingresos"?"$":"u"};
  let o;
  if(id){o=state.metas.find(x=>x.id===id);Object.assign(o,data);}
  else{o={id:nid(),...data};state.metas.push(o);}
  DB.upsertMeta(o);closeModal();render();
}
function delMetaAct(id){state.metas=state.metas.filter(m=>m.id!==id);DB.deleteMeta(id);render();}

function saveConfigAct(){
  state.config.seguidoresActual=Number(document.getElementById("cfgSegAct").value)||0;
  state.config.seguidoresInicial=Number(document.getElementById("cfgSegIni").value)||0;
  state.config.diasMetricas=Number(document.getElementById("cfgDias").value)||4;
  state.config.precios=state.config.precios||{};
  PRODUCTOS.forEach(p=>{const el=document.getElementById("cfgPre_"+p.id);if(el)state.config.precios[p.id]=Number(el.value)||0;});
  hydrate(); // reafirma la prioridad: si el producto está sincronizado con Mercado Libre, el manual no lo pisa
  DB.saveConfig();toast("Configuración guardada");render();
}
function wipeAll(){
  state.contenido=[];state.metas=[];
  state.config={seguidoresActual:0,seguidoresInicial:0,diasMetricas:state.config.diasMetricas||4,precios:state.config.precios||{}};
  DB.wipe();toast("Listo — base vacía");go("resumen");
}
function toast(msg){const t=document.createElement("div");t.textContent=msg;t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;z-index:200;box-shadow:var(--shadow)";document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ============================================================
   ROUTER / RENDER
   ============================================================ */
let current="resumen";
const TITLES={resumen:"Resumen",contenido:"Contenido",comparar:"Comparar",ads:"Meta Ads",metas:"Metas",productos:"Productos",metricas:"Métricas",reportes:"Reportes",recordatorios:"Recordatorios",config:"Configuración"};
function buildNav(){
  const nav=document.getElementById("nav");const rem=reminders();
  nav.innerHTML=`<div class="lbl">Gestión</div>`+NAV.map(([v,t])=>`<a data-view="${v}" class="${v===current?"on":""}">${icon(v)}<span>${t}</span>${v==="recordatorios"&&rem.total?`<span class="cnt">${rem.total}</span>`:""}</a>`).join("");
  document.querySelector(".side-foot .nav").innerHTML=`<a data-view="config" class="${current==="config"?"on":""}">${icon("config")}<span>Configuración</span></a>`;
}
function render(){
  document.getElementById("view").innerHTML=(Views[current]||Views.resumen)();
  document.getElementById("pageTitle").textContent=TITLES[current]||"Panel";
  buildNav();
  const rem=reminders();document.getElementById("bellDot").hidden=rem.total===0;
  // rewire selects de filtros
  const fe=document.getElementById("fEstado");if(fe)fe.onchange=()=>{contFilter.estado=fe.value;render();};
  const fc=document.getElementById("fCanal");if(fc)fc.onchange=()=>{contFilter.canal=fc.value;render();};
  const ci=document.getElementById("corteInput");if(ci)ci.onchange=()=>{reportCorte=ci.value;render();};
}
/* búsqueda inteligente: se cablea una sola vez, no en cada render */
(function wireBusqueda(){
  const go=()=>{
    const inp=document.getElementById("globalSearch");if(!inp)return;
    inp.addEventListener("input",()=>renderBusqueda(inp.value));
    inp.addEventListener("focus",()=>{if(inp.value.trim())renderBusqueda(inp.value);});
    inp.addEventListener("keydown",e=>{
      if(e.key==="Escape"){inp.value="";renderBusqueda("");inp.blur();}
      if(e.key==="Enter"){const f=document.querySelector("#searchResults .sr-item");if(f)f.click();}
    });
    // Ctrl/Cmd+K enfoca la lupa
    document.addEventListener("keydown",e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();inp.focus();inp.select();}
    });
    // click afuera cierra los resultados
    document.addEventListener("click",e=>{
      if(!e.target.closest(".search")){const b=document.getElementById("searchResults");if(b){b.hidden=true;}}
    });
  };
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();
})();
function go(v){current=v;document.getElementById("app").classList.remove("open");document.getElementById("view").parentElement.scrollTop=0;render();}

/* ============================================================
   EVENTOS (delegación)
   ============================================================ */
document.addEventListener("click",e=>{
  // un link real (ej. "ver el video") navega y no dispara la fila que lo contiene.
  // Los <a> del nav no tienen href, así que no entran acá.
  if(e.target.closest("a[href]"))return;
  // click en el fondo del overlay (fuera del cuadro) cierra el modal; clicks adentro siguen su curso
  if(e.target.closest(".overlay")&&!e.target.closest(".modal")){closeModal();return;}
  const t=e.target.closest("[data-view],[data-action],[data-open],[data-savecont],[data-delcont],[data-editmeta],[data-delmeta],[data-savemeta],[data-met],[data-carpeta],[data-ads],[data-cmp],[data-grupo]");
  if(!t)return;
  if(t.dataset.carpeta){contFilter.carpeta=t.dataset.carpeta;render();return;}
  if(t.dataset.cmp){
    const id=t.dataset.cmp;
    if(comparar.includes(id))comparar=comparar.filter(x=>x!==id);
    else if(comparar.length>=4)toast("Máximo 4 piezas a la vez");
    else comparar.push(id);
    render();return;
  }
  if(t.dataset.grupo){comparar=gruposDeVersiones()[+t.dataset.grupo].arr.slice(0,4).map(c=>c.id);go("comparar");return;}
  if(t.dataset.ads){const [id,est]=t.dataset.ads.split("|");setAdsEstado(id,est||null);return;}
  if(t.dataset.view){go(t.dataset.view);return;}
  if(t.dataset.open){
    const b=document.getElementById("searchResults");if(b)b.hidden=true;  // cerrar la lupa al abrir un resultado
    contenidoModal(t.dataset.open);return;
  }
  if(t.dataset.savecont!==undefined){saveContenido(t.dataset.savecont||null);return;}
  if(t.dataset.delcont){delContenidoAct(t.dataset.delcont);return;}
  if(t.dataset.editmeta){metaModal(t.dataset.editmeta);return;}
  if(t.dataset.delmeta){if(confirm("¿Borrar esta meta?"))delMetaAct(t.dataset.delmeta);return;}
  if(t.dataset.savemeta!==undefined){saveMeta(t.dataset.savemeta||null);return;}
  if(t.dataset.met){metFilter=t.dataset.met;render();return;}
  const a=t.dataset.action;
  if(a==="newContenido")contenidoModal(null);
  else if(a==="newMeta")metaModal(null);
  else if(a==="closeModal")closeModal();
  else if(a==="openNav")document.getElementById("app").classList.add("open");
  else if(a==="closeNav")document.getElementById("app").classList.remove("open");
  else if(a==="toggleTheme")toggleTheme();
  else if(a==="dismissBanner"){const b=document.getElementById("banner");if(b)b.style.display="none";}
  else if(a==="printReport")window.print();
  else if(a==="saveConfig")saveConfigAct();
  else if(a==="recalcPrecios")recalcPrecios();
  else if(a==="limpiarCmp"){comparar=[];render();}
  else if(a==="wipe"){if(confirm("Esto borra TODO el contenido y las metas cargadas. ¿Seguro?"))wipeAll();}
});

/* tema */
function setThemeIcon(){const d=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("themeBtn").innerHTML=d?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>':'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");const isDark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);const next=isDark?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("purexis_theme",next)}catch(e){}setThemeIcon();}
(function initTheme(){try{const s=localStorage.getItem("purexis_theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}})();

/* ============================================================
   ARRANQUE
   ============================================================ */
async function boot(){
  render();setThemeIcon();
  await DB.init();
  render();
}
boot();
</script>
