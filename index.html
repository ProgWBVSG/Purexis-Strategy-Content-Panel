<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131B1A" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#EBEFEF" media="(prefers-color-scheme:light)">
<meta name="description" content="Panel de control de contenido, ventas y pauta de Purexis.">
<title>Panel Purexis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#EBEFEF;
  --surface:#FFFFFF;
  --surface-2:#F5F8F8;
  --surface-3:#EEF3F2;
  --border:#E4E9E9;
  --border-2:#EDF1F1;
  --text:#141E1D;
  --muted:#74807E;
  --muted-2:#9BA6A4;
  --accent:#10B0A0;
  --accent-ink:#0B7E72;
  --accent-soft:#E1F4F1;
  --good:#16A34A; --good-soft:#E7F6EC;
  --warn:#DE8A0B; --warn-soft:#FBF1DE;
  --bad:#E5484D; --bad-soft:#FBE9EA;
  --info:#6366F1; --info-soft:#ECEDFD;
  --rust:#E1863B; --rust-soft:#FBEEDF;
  --shadow-sm:0 1px 2px rgba(18,38,36,.05);
  --shadow:0 1px 2px rgba(18,38,36,.04),0 10px 26px rgba(18,38,36,.06);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --font:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0C1211; --surface:#131B1A; --surface-2:#182120; --surface-3:#1E2827;
    --border:#26312F; --border-2:#212C2B; --text:#EAF0EF; --muted:#93A09D; --muted-2:#6C7A76;
    --accent:#2AC7B6; --accent-ink:#7FE6DA; --accent-soft:#123330;
    --good:#3BB667; --good-soft:#13291C; --warn:#E7A33A; --warn-soft:#2C2410;
    --bad:#F26569; --bad-soft:#2E1517; --info:#8487F5; --info-soft:#1A1B33;
    --rust:#EC9A55; --rust-soft:#2C1F12;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1211; --surface:#131B1A; --surface-2:#182120; --surface-3:#1E2827;
  --border:#26312F; --border-2:#212C2B; --text:#EAF0EF; --muted:#93A09D; --muted-2:#6C7A76;
  --accent:#2AC7B6; --accent-ink:#7FE6DA; --accent-soft:#123330;
  --good:#3BB667; --good-soft:#13291C; --warn:#E7A33A; --warn-soft:#2C2410;
  --bad:#F26569; --bad-soft:#2E1517; --info:#8487F5; --info-soft:#1A1B33;
  --rust:#EC9A55; --rust-soft:#2C1F12;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.tnum{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px;border:3px solid var(--surface)}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh;overflow:hidden}
.scrim{display:none}

/* ---------- SIDEBAR ---------- */
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:20px 20px 16px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#3D6EE8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand .name{font-weight:800;letter-spacing:.12em;font-size:15px}
.orgpill{margin:0 14px 6px;display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:11px;cursor:pointer}
.orgpill .sq{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.orgpill .t{font-weight:600;font-size:13px;flex:1}
.orgpill .t small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.orgpill svg{color:var(--muted-2)}
.nav{flex:1;overflow-y:auto;padding:10px 12px}
.nav .lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--muted-2);padding:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;position:relative;margin-bottom:1px}
.nav a svg{width:17px;height:17px;flex:none;stroke-width:1.9}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--surface-3);color:var(--text)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.side-foot{padding:10px 12px;border-top:1px solid var(--border)}

/* ---------- MAIN ---------- */
.main{min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:13px 26px}
.topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.search{flex:1;max-width:440px;margin:0 auto;position:relative}
.search input{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 12px 9px 34px;color:var(--text);outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.search .ai{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 7px;border-radius:6px;letter-spacing:.04em}
.tb-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;position:relative}
.tb-btn:hover{color:var(--text);border-color:var(--muted-2)}
.tb-btn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3D6EE8,var(--accent));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.content{padding:22px 26px 60px;max-width:1240px;width:100%}

/* ---------- PRIMITIVES ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:18px}
.row{display:flex;gap:16px}
.grid{display:grid;gap:16px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap}
.chip .d{width:6px;height:6px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;padding:9px 14px;border-radius:10px}
.btn:hover{border-color:var(--muted-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.96)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted-2);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.section-h{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.section-h h2{font-size:15px;font-weight:700;margin:0}
.section-h .sp{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}

/* progress */
.pbar{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),#3D6EE8)}

/* ---------- STAT CARDS ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow-sm)}
.stat .top{display:flex;align-items:flex-start;justify-content:space-between}
.stat .lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.stat .ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.stat .val{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:9px 0 6px}
.stat .delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.stat .delta small{color:var(--muted-2);font-weight:500}
.up{color:var(--good)} .down{color:var(--bad)}

/* ---------- BANNER ---------- */
.banner{background:linear-gradient(100deg,#12B3A3 0%,#2E8FD6 55%,#3D6EE8 100%);color:#fff;border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;box-shadow:0 10px 24px rgba(45,143,214,.25)}
.banner .bic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.banner .bt{flex:1}
.banner .bt b{font-size:14px;font-weight:700}
.banner .bt p{margin:2px 0 0;font-size:12.5px;opacity:.9}
.banner .rev{background:#fff;color:#0E7A6E;border:none;font-weight:700;font-size:12.5px;padding:9px 15px;border-radius:9px}
.banner .x{color:#fff;opacity:.8;background:transparent;border:none;display:grid;place-items:center}

/* ---------- TABLE ---------- */
.tablecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.tablecard .th{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border)}
.tablecard .th h2{font-size:14.5px;font-weight:700;margin:0}
.tablecard .th .sp{flex:1}
.grouprow{display:flex;align-items:center;gap:8px;padding:11px 18px;background:var(--surface-2);border-bottom:1px solid var(--border-2);font-size:12.5px;font-weight:600}
.grouprow .gt{color:var(--muted-2);font-size:11.5px;font-weight:500}
.grouprow .sp{flex:1}
.grouprow .tot{color:var(--muted);font-size:11.5px;font-weight:500}
.grouprow .tot b{color:var(--text);font-weight:700}
table.dt{width:100%;border-collapse:collapse}
table.dt th{text-align:left;font-size:11px;font-weight:600;color:var(--muted-2);padding:10px 18px;border-bottom:1px solid var(--border-2);white-space:nowrap;letter-spacing:.02em}
table.dt td{padding:12px 18px;border-bottom:1px solid var(--border-2);vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr:hover{background:var(--surface-2)}
.ct-name{display:flex;align-items:center;gap:11px}
.ct-name .ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.ct-name b{font-weight:600;font-size:13px;display:block}
.ct-name small{color:var(--muted-2);font-size:11px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* charts */
.chart-wrap{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.legend span i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span b{color:var(--text);font-weight:700}

/* meta / product cards */
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:11px}
.gcard .gh{display:flex;align-items:flex-start;gap:10px}
.gcard .gh .sp{flex:1}
.gcard h3{font-size:14px;font-weight:700;margin:0}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.ring::after{content:attr(data-l);width:40px;height:40px;background:var(--surface);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}

/* form / modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,19,.45);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow-y:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal .mh h3{margin:0;font-size:16px;font-weight:700;flex:1}
.mbody{padding:20px;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:9px 11px;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:8px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* panel de resultados de la búsqueda inteligente */
.sr-panel{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:min(60vh,420px);overflow-y:auto;padding:6px}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;padding:9px 10px;border-radius:9px;color:var(--text);cursor:pointer}
.sr-item:hover,.sr-item:focus-visible{background:var(--surface-2);outline:none}
.tipochip{cursor:pointer;transition:background .15s,border-color .15s,color .15s}

.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty svg{color:var(--muted-2);margin-bottom:10px}

.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px}

.example-tag{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 6px;border-radius:5px;letter-spacing:.03em}

.hb{display:none}

@media (max-width:1000px){
  .stats{grid-template-columns:1fr}
  .kpi4{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .app.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .app.open .scrim{display:block}
  .hb{display:grid}
  .content{padding:16px 14px 80px}

  /* la barra de arriba pasa a dos filas: el buscador es la función principal,
     no se esconde — baja a lo ancho debajo del título */
  .topbar{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .topbar h1{flex:1;font-size:16px}
  .search{order:10;flex:1 1 100%;max-width:none;margin:0}
  .avatar{display:none}

  /* los grids de 2 columnas están inline en las vistas: hay que pisarlos */
  .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .f2{grid-template-columns:1fr}
  .f4{grid-template-columns:1fr 1fr}   /* 4 campitos de venta: 2x2 antes que 4 filas */

  /* dedo, no mouse */
  .iconbtn{width:38px;height:38px}
  .btn{padding:10px 14px}
  .btn.sm{padding:8px 12px}
  .nav a{padding:11px 10px}
  /* 16px o iOS hace zoom al enfocar un campo */
  .field input,.field select,.field textarea,.search input{font-size:16px}

  table.dt th,table.dt td{padding:10px 12px}
  .sm-hide{display:none}          /* columnas secundarias fuera en pantalla chica */
  .section-h{flex-wrap:wrap;row-gap:8px}
  .banner{flex-wrap:wrap;row-gap:10px}
  .banner .bt{flex:1 1 100%}
  .modal{max-height:92vh}
  .mbody{padding:16px}
  .stat .val{font-size:24px}
  .tablecard .th{flex-wrap:wrap;row-gap:8px}
}
@media (max-width:760px){
  /* comparador: la columna de métrica queda fija al scrollear en horizontal,
     si no se pierde de vista qué se está leyendo */
  table.cmp td:first-child,table.cmp th:first-child{
    position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--border-2)}
  table.cmp tbody tr:hover td:first-child{background:var(--surface-2)}
}
@media (max-width:430px){
  .kpi4{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:19px}
  .seg{width:100%}
  .seg button{flex:1;padding:8px 6px}
}
@media print{
  .side,.topbar,.no-print{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible}
  .content{padding:0}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="scrim" data-action="closeNav"></div>
  <aside class="side">
    <div class="brand"><div class="mark">P</div><div class="name">PUREXIS</div></div>
    <div class="orgpill">
      <div class="sq">P</div>
      <div class="t">Purexis<small>Limpieza para tu hogar</small></div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">Gestión</div>
      <a data-view="resumen" class="on">${''}</a>
    </nav>
    <div class="side-foot">
      <nav class="nav" style="padding:0">
        <a data-view="config">${''}</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="tb-btn hb" data-action="openNav" aria-label="Menú">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <h1 id="pageTitle">Resumen</h1>
      <div class="search">
        <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input id="globalSearch" placeholder="Buscar: moho, venta, sin métricas…" autocomplete="off">
        <span class="ai">IA</span>
        <div id="searchResults" class="sr-panel" hidden></div>
      </div>
      <button class="tb-btn" data-action="toggleTheme" aria-label="Tema" id="themeBtn"></button>
      <button class="tb-btn" data-view="recordatorios" aria-label="Recordatorios" id="bellBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot" id="bellDot" hidden></span>
      </button>
      <div class="avatar">P</div>
    </header>
    <div class="content" id="view"></div>

/* cálculos */
const unidades=it=>PRODUCTOS.reduce((s,p)=>s+(it.ventas?.[p.id]||0),0);
/** Precio unitario CONGELADO: el que tenía el producto cuando se registró esa venta.
 *  Si Mercado Libre sube o baja después, los ingresos históricos no se recalculan.
 *  Sin snapshot (piezas viejas) cae al precio actual. */
function precioDe(it,pid){
  const snap=it&&it.preciosSnapshot?it.preciosSnapshot[pid]:null;
  if(snap!=null&&!isNaN(snap))return Number(snap);
  return PMAP[pid]?PMAP[pid].precio:0;
}
const ingresosItem=it=>PRODUCTOS.reduce((s,p)=>s+(it.ventas?.[p.id]||0)*precioDe(it,p.id),0);
/** true si la pieza tiene al menos un precio congelado (venta ya registrada) */

function totIngresos(items){return (items||state.contenido).reduce((s,it)=>s+ingresosItem(it),0);}
function totUnidades(items){return (items||state.contenido).reduce((s,it)=>s+unidades(it),0);}
const totSeguidoresGanados=items=>(items||state.contenido).reduce((s,it)=>s+(it.seguidoresGanados||0),0);
/** Seguidores de hoy. Los que cargás por reel SUMAN sobre la base inicial.

/* ============================================================
   MOTOR DE DECISIÓN PARA META ADS
   ------------------------------------------------------------
   El problema que resuelve: un reel de TENDENCIA puede volar en
   alcance y seguidores y parecer el mejor candidato a publicitar,
   pero no vende — porque no muestra el dolor ni empuja a comprar.
   Un ranking por alcance te haría quemar presupuesto ahí.

   Por eso el motor separa dos cosas:
   1. RENDIMIENTO  — qué tan bien performó (señales ponderadas).
   2. ESTRUCTURA   — si la pieza está construida para vender.
   La plata solo se recomienda cuando las DOS dan bien.
   ============================================================ */
const ADS_CFG={
  alcanceMin:1000,    // por debajo de esto la muestra no es concluyente
  // Piso de "excelente" en conversión: 0,8 ventas por cada 1.000 de alcance (0,08%).
  // Calibrado para venta directa desde Instagram a un producto de ticket medio-alto:
  // pedir 0,2% haría que hasta un reel que factura cientos de miles parezca flojo.
  refConv:0.0008,
  refIntencion:0.02,  // 2% de (guardados+compartidos) sobre alcance
  refRetencion:1.0,   // vistas/alcance >= 1 significa que se revió
  refSeguidores:0.005,
  // volumen desde el cual una pieza demuestra que puede viajar sola
  alcanceConfiable:1500,
  // techos de cordura: por encima de esto la tasa es medición rota, no récord
  maxTasa:0.5, maxRetencion:4,
  minListo:60, minCandidato:40,
};
const ADS_ESTADOS={
  listo:      {t:"Listo para anunciar", c:"var(--good)", bg:"var(--good-soft)", orden:1},
  candidato:  {t:"Candidato",           c:"var(--warn)", bg:"var(--warn-soft)", orden:2},
  marca:      {t:"Sirve para marca",    c:"var(--info)", bg:"var(--info-soft)", orden:3},
  anunciando: {t:"Anunciando",          c:"var(--accent-ink)", bg:"var(--accent-soft)", orden:0},
  anunciado:  {t:"Ya anunciado",        c:"var(--muted)", bg:"var(--surface-3)", orden:5},
  insuficiente:{t:"Sin datos",          c:"var(--muted-2)", bg:"var(--surface-3)", orden:6},
  no:         {t:"No recomendado",      c:"var(--bad)", bg:"var(--bad-soft)", orden:4},
  descartado: {t:"Descartado",          c:"var(--muted-2)", bg:"var(--surface-3)", orden:7},
};

/** Alcance mínimo ADAPTATIVO. Pedir 1.000 fijo deja el sistema mudo en una cuenta
 *  que todavía mide en cientos: mejor bajar el listón al tamaño real de la cuenta
 *  (nunca por debajo de 100, donde ya no se puede concluir nada). */
function alcanceMinimo(){
  const a=publicados().filter(c=>c.metricasCargadas&&(c.alcance||0)>0).map(c=>c.alcance).sort((x,y)=>x-y);
  if(!a.length)return ADS_CFG.alcanceMin;
  const mediana=a[Math.floor(a.length/2)];
  return Math.max(100,Math.min(ADS_CFG.alcanceMin,Math.round(mediana*0.6)));
}

/** ¿La pieza tiene volumen suficiente para que sus TASAS signifiquen algo?
 *  Con 10 personas alcanzadas, 20 compartidos dan "200% de intención": ruido, no señal. */
const esConfiable=it=>(it.alcance||0)>=alcanceMinimo();
/** Tasas de una pieza, con techo sano: una tasa por encima de MAX_TASA es
 *  medición rota (compartidos > alcance, por ejemplo), no un récord. */
function adsTasas(it){
  const a=it.alcance||0;
  const cap=v=>Math.min(v,ADS_CFG.maxTasa);
  return {
    conv:      a?cap(unidades(it)/a):0,
    intencion: a?cap(((it.guardados||0)+(it.compartidos||0))/a):0,
    retencion: a?Math.min((it.vistas||0)/a,ADS_CFG.maxRetencion):0,
    seguidores:a?cap((it.seguidoresGanados||0)/a):0,
  };
}

/** Referencias del catálogo. CLAVE: solo miran piezas con volumen confiable.
 *  Antes, una pieza de 10 de alcance con una tasa imposible se volvía el techo
 *  y hundía a todas las demás. Una pieza rota ya no puede envenenar la escala. */
function adsRefs(){
  const pub=publicados().filter(c=>c.metricasCargadas&&(c.alcance||0)>0&&esConfiable(c));
  const mx=(f)=>pub.reduce((m,c)=>Math.max(m,f(adsTasas(c))),0);
  return {
    conv:      Math.max(mx(t=>t.conv),      ADS_CFG.refConv),
    intencion: Math.max(mx(t=>t.intencion), ADS_CFG.refIntencion),
    retencion: Math.max(mx(t=>t.retencion), ADS_CFG.refRetencion),
    seguidores:Math.max(mx(t=>t.seguidores),ADS_CFG.refSeguidores),
  };
}

/** Evalúa una pieza. Devuelve score, estado y — lo más importante — el motivo
 *  en palabras, para que la decisión sea auditable y no un número mágico. */
function adsEval(it,refs){
  refs=refs||adsRefs();
  const alcance=it.alcance||0, uni=unidades(it);
  const T=adsTasas(it);
  const conv=T.conv,intencion=T.intencion,retencion=T.retencion,segRate=T.seguidores;
  const n=(v,ref)=>Math.max(0,Math.min(1,ref?v/ref:0));
  // VOLUMEN como señal propia: en pauta, una pieza que ya viajó sola demuestra
  // que puede sostener entrega. Una tasa linda sobre 10 personas no demuestra nada.
  const volumen=Math.max(0,Math.min(1,alcance/ADS_CFG.alcanceConfiable));
  const s={conv:n(conv,refs.conv),intencion:n(intencion,refs.intencion),
           retencion:n(retencion,refs.retencion),seguidores:n(segRate,refs.seguidores),volumen};
  const confiable=esConfiable(it);
  // sin volumen confiable el puntaje no se presenta como comparable
  const score=confiable?Math.round(40*s.conv+20*s.intencion+20*s.retencion+10*s.seguidores+10*s.volumen):null;

  const tipos=it.tipos||[];
  const tieneVenta=tipos.includes("venta");
  const soloTendencia=tipos.includes("tendencia")&&!tieneVenta;
  // ingreso orgánico por cada 1000 de alcance: comparable directo contra el CPM de Meta
  const rpm=alcance?ingresosItem(it)/alcance*1000:0;

  let estado,motivo;
  if(it.adsEstado){                       // decisión manual: manda sobre el automático
    estado=it.adsEstado;
    motivo=estado==="anunciando"?"Lo marcaste como en campaña activa."
      :estado==="anunciado"?"Ya lo anunciaste."
      :"Lo descartaste a mano.";
  }else if(it.estado!=="publicado"){
    estado="insuficiente";motivo="Todavía no está publicado.";
  }else if(!it.metricasCargadas){
    estado="insuficiente";motivo="Faltan cargar las métricas de esta pieza.";
  }else if(alcance<alcanceMinimo()){
    estado="insuficiente";motivo=`Solo ${num(alcance)} de alcance: muy poco para concluir algo (mínimo ${num(alcanceMinimo())} según el tamaño actual de tu cuenta).`;
  }else if(!tipos.length){
    estado="insuficiente";motivo="Marcá si es de venta, valor o tendencia para poder evaluarla.";
  }else if(soloTendencia){
    estado="marca";
    motivo=uni>0
      ? `Es tendencia pura y aun así vendió ${uni} u. Ojo: el alcance vino de la moda, no del dolor — al pautarla es probable que no repita. Si la querés usar, primero remontala con estructura de venta.`
      : `Buen alcance${it.seguidoresGanados?` y trajo ${num(it.seguidoresGanados)} seguidores`:""}, pero es tendencia pura y no vendió. Sirve para marca, no para pautar.`;
  }else if(!tieneVenta){
    estado="marca";
    motivo=`Aporta valor y construye autoridad, pero no tiene estructura de venta. Para pautar conviene una versión con PAS o Before/After.`;
  }else if(uni===0){
    estado="candidato";
    motivo="Tiene estructura de venta pero todavía no vendió nada en orgánico. Esperá a que madure antes de ponerle plata.";
  }else if(score>=ADS_CFG.minListo){
    estado="listo";
    motivo=`Vendió ${uni} u con ${num(alcance)} de alcance y genera ${money(rpm)} por cada 1.000 de alcance orgánico. Si tu CPM en Meta es menor a eso, la pauta da ganancia.`;
  }else if(score>=ADS_CFG.minCandidato){
    estado="candidato";
    // el motivo enuncia el número concreto en vez de afirmar comparaciones que pueden ser falsas
    const flojo=s.conv<0.5
        ?`convierte ${(conv*1000).toFixed(1)} ventas por cada 1.000 de alcance y para que la pauta cierre conviene desde ${(refs.conv*1000).toFixed(1)}`
      :s.intencion<0.5?"le faltan guardados y compartidos, que es la señal de que hay intención de compra"
      :"el alcance todavía es chico para confirmarlo";
    motivo=`Vendió ${uni} u, pero ${flojo}. Mirala de nuevo en unos días.`;
  }else{
    estado="no";
    motivo=`Vendió ${uni} u pero las señales están flojas frente al resto de tu contenido. No conviene pautarla.`;
  }
  return {score,estado,motivo,señales:s,conv,intencion,retencion,segRate,rpm,uni,tieneVenta};
}

/** Todas las piezas evaluadas y ordenadas: primero lo accionable, después el resto. */
function adsRanking(){
  const refs=adsRefs();
  return state.contenido.map(it=>({it,ev:adsEval(it,refs)}))
    .sort((a,b)=>(ADS_ESTADOS[a.ev.estado]?.orden??9)-(ADS_ESTADOS[b.ev.estado]?.orden??9)||b.ev.score-a.ev.score);
}

function metaActual(m){
  if(m.metrica==="unidades")return totUnidades();
  if(m.metrica==="ingresos")return totIngresos();
  if(m.metrica==="seguidores")return seguidoresHoy();
  if(m.metrica==="publicaciones")return publicados().length;
  if(m.metrica==="vistas")return publicados().reduce((s,c)=>s+(c.vistas||0),0);
  return m.actual||0;
}
/* recordatorios: publicados sin métricas cuyo plazo venció */
function reminders(){
  const dias=state.config.diasMetricas||4;
  const out={vencidos:[],porVencer:[],atrasadosPub:[],metas:[]};
  state.contenido.forEach(c=>{
    if(c.estado==="publicado"&&!c.metricasCargadas){
      const limite=addDays(pd(c.fecha),dias);
      const dd=daysDiff(HOY,limite);
      if(dd>=0)out.vencidos.push({c,dias:dd});
      else if(dd>=-2)out.porVencer.push({c,dias:-dd});
    }
    if(c.estado!=="publicado"&&c.estado!=="idea"&&daysDiff(HOY,pd(c.fecha))>0){
      out.atrasadosPub.push({c,dias:daysDiff(HOY,pd(c.fecha))});
    }
  });
  state.metas.forEach(m=>{const dd=daysDiff(pd(m.fechaLimite),HOY);const pct=metaActual(m)/m.objetivo*100;
    if(dd>=0&&dd<=7&&pct<100)out.metas.push({m,dias:dd,pct});});
  out.total=out.vencidos.length;
  return out;
}

/* ============================================================

function donut(data,{size=170,thick=26,center=""}={}){
  const tot=data.reduce((s,d)=>s+d.v,0)||1;const r=(size-thick)/2,C=2*Math.PI*r,cx=size/2;let off=0;
  let segs=data.filter(d=>d.v>0).map(d=>{const len=d.v/tot*C;const s=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${thick}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})" stroke-linecap="butt"/>`;off+=len;return s;}).join("");
  if(!data.some(d=>d.v>0))segs=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${thick}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%">${segs}${center?`<text x="${cx}" y="${cx-4}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${center.split("|")[0]}</text><text x="${cx}" y="${cx+15}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${center.split("|")[1]||""}</text>`:""}</svg>`;
}
function hbars(data,{fmt=num,unit=""}={}){
  const max=Math.max(1,...data.map(d=>d.v));
  return `<div style="display:grid;gap:12px">`+data.map(d=>`
    <div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
        <b style="font-weight:600">${esc(d.l)}</b><b class="tnum" style="font-weight:700">${fmt(d.v)}${unit}</b>
      </div>
      <div class="pbar" style="height:10px"><i style="width:${d.v/max*100}%;background:${d.c||'var(--accent)'}"></i></div>
    </div>`).join("")+`</div>`;
}
function vbars(data,{h=180,fmt=num,color="var(--accent)"}={}){
  const max=Math.max(1,...data.map(d=>d.v));const w=100/data.length;
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:${h}px;padding-top:8px">`+
    data.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0">
      <div class="tnum" style="font-size:11px;font-weight:700;margin-bottom:6px;color:var(--muted)">${d.v?fmt(d.v):""}</div>
      <div style="width:100%;max-width:46px;height:${Math.max(2,d.v/max*100)}%;background:${d.hl?color:'color-mix(in srgb,'+color+' 32%,transparent)'};border-radius:7px 7px 3px 3px;transition:height .4s"></div>
      <div style="font-size:10.5px;font-weight:600;color:var(--muted-2);margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(d.l)}</div>
    </div>`).join("")+`</div>`;
}
function lineChart(points,{w=560,h=170,fmt=num,color="var(--accent)"}={}){
  if(points.length<2)return "";
  const pad={l:44,r:14,t:14,b:26};const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const xs=points.map((_,i)=>pad.l+i/(points.length-1)*iw);
  const max=Math.max(...points.map(p=>p.v)),min=Math.min(...points.map(p=>p.v),0);
  const ry=v=>pad.t+ih-(v-min)/((max-min)||1)*ih;
  const line=points.map((p,i)=>`${i?"L":"M"}${xs[i].toFixed(1)} ${ry(p.v).toFixed(1)}`).join(" ");
  const area=line+` L${xs[xs.length-1]} ${pad.t+ih} L${xs[0]} ${pad.t+ih} Z`;
  const grid=[0,.5,1].map(t=>{const y=pad.t+ih-t*ih;const val=min+t*(max-min);return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${pad.l-8}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--muted-2)">${kfmt(val)}</text>`;}).join("");
  const dots=points.map((p,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${ry(p.v).toFixed(1)}" r="${i===points.length-1?4:3}" fill="${i===points.length-1?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`).join("");
  const labs=points.map((p,i)=>`<text x="${xs[i].toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted-2)">${esc(p.l)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#lg)"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}</svg>`;
}

function canalChip(c){return c==="anuncio"
  ? `<span class="chip" style="background:var(--info-soft);color:var(--info)"><span class="d" style="background:var(--info)"></span>Anuncio</span>`
  : `<span class="chip" style="background:var(--accent-soft);color:var(--accent-ink)"><span class="d" style="background:var(--accent)"></span>Orgánico</span>`;}
function estadoChip(e){const s=ESTADOS[e]||ESTADOS.idea;return `<span class="chip" style="background:${s.bg};color:${s.c}">${s.t}</span>`;}
function tipoIcon(t){const m={reel:'<path d="M8 5v14l11-7z"/>',carrusel:'<rect x="4" y="6" width="12" height="12" rx="2"/><path d="M18 8v8M21 10v4"/>',historia:'<circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/>'};
  const c={reel:"var(--accent)",carrusel:"var(--info)",historia:"var(--rust)"}[t];
  return `<div class="ti" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}"><svg width="16" height="16" viewBox="0 0 24 24" fill="${t==='reel'?c:'none'}" stroke="${c}" stroke-width="2">${m[t]}</svg></div>`;}
function icon(name,sz=17){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[name]}</svg>`;}
function exampleTag(o){return o.ejemplo?`<span class="example-tag">ejemplo</span>`:"";}
function relTime(iso){
  if(!iso)return "";
  const ms=Date.now()-new Date(iso).getTime();if(isNaN(ms))return "";
  const min=Math.round(ms/60000);
  if(min<1)return "recién";
  if(min<60)return "hace "+min+"m";
  const h=Math.round(min/60);if(h<24)return "hace "+h+"h";
  const d=Math.round(h/24);return "hace "+d+"d";
}
/** Tarjeta de precio sincronizado con Mercado Libre para un producto. Si todavía no

      <button class="btn sm pri" data-action="newContenido">+ Nueva pieza</button></div>

const THEAD_CONTENIDO=`<thead><tr><th>Contenido</th><th class="sm-hide">Carpeta / tipo</th><th class="sm-hide">Canal</th><th class="sm-hide">Fecha</th><th>Vistas</th><th class="sm-hide">Segs</th><th>Ventas</th><th>Estado</th><th></th></tr></thead>`;

Views.contenido=()=>{
  let items=[...state.contenido];
  if(contFilter.estado!=="todos")items=items.filter(c=>c.estado===contFilter.estado);
  if(contFilter.canal!=="todos")items=items.filter(c=>c.canal===contFilter.canal);
  if(contFilter.carpeta!=="todas")items=items.filter(c=>(c.producto||"general")===contFilter.carpeta);
  items.sort((a,b)=>pd(b.fecha)-pd(a.fecha));

  const estadoOpts=`<option value="todos">Todos los estados</option>`+Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${contFilter.estado===k?"selected":""}>${v.t}</option>`).join("");

  // tarjetas de carpeta: cuántas piezas y cuántas unidades vendió cada producto
  const enCarpeta=(id)=>state.contenido.filter(c=>(c.producto||"general")===id);
  const folders=CARPETAS.map(k=>{
    const arr=enCarpeta(k.id), u=arr.reduce((s,c)=>s+unidades(c),0);
    const on=contFilter.carpeta===k.id;
    return `<button class="card pad" data-carpeta="${k.id}" style="text-align:left;cursor:pointer;border-color:${on?k.color:"var(--border)"};background:${on?`color-mix(in srgb,${k.color} 8%,var(--surface))`:"var(--surface)"};padding:13px 15px">

        <span style="width:9px;height:9px;border-radius:3px;background:${k.color};flex:none"></span>
        <b style="font-size:13px">${k.nombre}</b>
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:6px">${arr.length} pieza${arr.length!==1?"s":""}${u?` · <b style="color:var(--text)">${u} u vendidas</b>`:""}</div>
    </button>`;
  }).join("");

  const todas=contFilter.carpeta==="todas";
  let cuerpo="";
  if(todas){
    // agrupado por carpeta, para que se vea como carpetas de verdad
    const grupos=CARPETAS.map(k=>({k,arr:items.filter(c=>(c.producto||"general")===k.id)})).filter(g=>g.arr.length);
    cuerpo=grupos.map(g=>`
      <tr><td colspan="9" style="padding:0"><div class="grouprow">
        <span style="width:8px;height:8px;border-radius:2px;background:${g.k.color};display:inline-block"></span>
        <span>${g.k.nombre}</span><span class="gt">(${g.arr.length})</span><span class="sp"></span>
        <span class="tot">Ventas <b class="tnum">${g.arr.reduce((s,c)=>s+unidades(c),0)} u</b></span>
      </div></td></tr>
      ${g.arr.map(filaContenido).join("")}`).join("");
  }else{
    cuerpo=items.map(filaContenido).join("");
  }

  return `
  <div class="section-h">
    <div><div class="eyebrow">Organización</div><h2 style="font-size:19px">Carpetas de contenido</h2></div>
    <span class="sp"></span>
    <select class="btn sm" id="fCanal" style="padding-right:26px">
      <option value="todos" ${contFilter.canal==="todos"?"selected":""}>Todos los canales</option>
      <option value="organico" ${contFilter.canal==="organico"?"selected":""}>Orgánico</option>
      <option value="anuncio" ${contFilter.canal==="anuncio"?"selected":""}>Anuncio</option>
    </select>
    <select class="btn sm" id="fEstado" style="padding-right:26px">${estadoOpts}</select>
    <button class="btn sm pri" data-action="newContenido">+ Nueva pieza</button>
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:8px">
    <button class="card pad" data-carpeta="todas" style="text-align:left;cursor:pointer;border-color:${todas?"var(--accent)":"var(--border)"};background:${todas?"var(--accent-soft)":"var(--surface)"};padding:13px 15px">
      <div style="display:flex;align-items:center;gap:9px">${icon("contenido",15)}<b style="font-size:13px">Todas</b></div>
      <div class="muted" style="font-size:11.5px;margin-top:6px">${state.contenido.length} pieza${state.contenido.length!==1?"s":""} en total</div>
    </button>
    ${folders}
  </div>
  <p class="muted" style="font-size:11.5px;margin:0 0 16px">Cada pieza vive en una sola carpeta — un guion, un producto. Cambiá la carpeta desde la pieza y se mueve sola.</p>

  <div class="tablecard">
    <div class="th"><h2>${items.length} pieza${items.length!==1?"s":""}${todas?"":` en ${CMAP[contFilter.carpeta]?.nombre||""}`}</h2><span class="sp"></span><span class="muted" style="font-size:12px">Tocá una fila para editar métricas y ventas</span></div>
    <div class="wrap"><table class="dt">
      ${THEAD_CONTENIDO}
      <tbody>${cuerpo||`<tr><td colspan="9"><div class="empty">${icon("contenido",30)}<div>No hay piezas con ese filtro.</div></div></td></tr>`}</tbody>
    </table></div>
  </div>`;
};

/* ---------- METAS ---------- */

    return `<div class="gcard">
      <div class="gh">
        <div style="flex:1"><div class="eyebrow" style="font-size:10px">${m.tipo}</div><h3>${esc(m.titulo)} ${exampleTag(m)}</h3></div>
        <div class="ring" style="--p:${pct};${done?'background:conic-gradient(var(--good) calc('+pct+'*1%),var(--surface-3) 0)':''}" data-l="${pct}%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b class="tnum" style="font-size:18px">${fmt(act)}</b>
        <span class="muted tnum" style="font-size:12.5px">de ${fmt(m.objetivo)}</span>

      <div style="display:flex;align-items:center;gap:8px">

        <button class="iconbtn" data-delmeta="${m.id}" title="Borrar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>

  return `
  <div class="section-h">
    <div><div class="eyebrow">Objetivos con plazo</div><h2 style="font-size:19px">Metas financieras y de contenido</h2></div>

    <button class="btn sm pri" data-action="newMeta">+ Nueva meta</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
    ${cards||`<div class="card"><div class="empty">${icon("metas",30)}<div>Todavía no cargaste metas.</div></div></div>`}
  </div>`;
};

/* ---------- PRODUCTOS ---------- */

  const pt=productTotals();
  const ranked=[...PRODUCTOS].map(p=>({...p,u:pt[p.id],ing:pt[p.id]*p.precio})).sort((a,b)=>b.u-a.u);

  const rows=ranked.map((p,i)=>`<tr>
    <td><div class="ct-name"><div class="ti" style="background:color-mix(in srgb,${p.color} 16%,transparent);color:${p.color};font-weight:800">${i+1}</div><div><b>${p.nombre}</b><small>${money(p.precio)} c/u ${MELI_SYNC[p.id]?`· <span style="color:var(--good)">Mercado Libre</span>`:`· <span style="color:var(--warn)">respaldo</span>`}</small></div></div></td>

  return `

/* ---------- MÉTRICAS ---------- */
let metFilter="todos";
Views.metricas=()=>{
  const pub=publicados();
  const items=metFilter==="todos"?pub:pub.filter(c=>c.canal===metFilter);
  const sum=(f)=>items.reduce((s,c)=>s+(f(c)||0),0);
  const vistas=sum(c=>c.vistas),alcance=sum(c=>c.alcance),likes=sum(c=>c.likes),
    coment=sum(c=>c.comentarios),guard=sum(c=>c.guardados),comp=sum(c=>c.compartidos),
    gasto=sum(c=>c.gastoAnuncio),ing=sum(ingresosItem),uni=sum(unidades);
  const eng=alcance?((likes+coment+guard+comp)/alcance*100):0;
  const roas=gasto?ing/gasto:0;

  // por semana
  const weeks=[];for(let i=5;i>=0;i--){const ws=weekStart(addDays(HOY,-i*7));weeks.push({ws,l:ws.getDate()+" "+MES[ws.getMonth()],v:0});}
  items.forEach(c=>{const ws=weekStart(pd(c.fecha)).getTime();const w=weeks.find(x=>x.ws.getTime()===ws);if(w)w.v+=c.vistas||0;});
  weeks.forEach((w,i)=>w.hl=i===weeks.length-1);

  const engData=[
    {l:"Likes",v:likes,c:"var(--bad)"},{l:"Comentarios",v:coment,c:"var(--info)"},
    {l:"Guardados",v:guard,c:"var(--accent)"},{l:"Compartidos",v:comp,c:"var(--good)"},
  ];

  const adsBlock=(metFilter!=="organico"&&gasto>0)?`
    <div class="card pad" style="margin-top:18px">
      <div class="section-h"><h2>Rendimiento de anuncios</h2><span class="sp"></span><span class="chip" style="background:var(--info-soft);color:var(--info)">Pago</span></div>
      <div class="kpi4">
        <div class="kpi"><div class="l">Inversión</div><div class="v tnum">${money(gasto)}</div></div>
        <div class="kpi"><div class="l">Ingresos por ads</div><div class="v tnum">${money(ing)}</div></div>
        <div class="kpi"><div class="l">ROAS</div><div class="v tnum" style="color:${roas>=1?'var(--good)':'var(--bad)'}">${roas.toFixed(2)}×</div></div>
        <div class="kpi"><div class="l">Costo por unidad</div><div class="v tnum">${money(uni?gasto/uni:0)}</div></div>
      </div>
    </div>`:"";

  return `
  <div class="section-h">
    <div><div class="eyebrow">Rendimiento</div><h2 style="font-size:19px">Métricas de contenido</h2></div>
    <span class="sp"></span>
    <div class="seg" id="metSeg">
      <button data-met="todos" class="${metFilter==="todos"?"on":""}">Todo</button>
      <button data-met="organico" class="${metFilter==="organico"?"on":""}">Orgánico</button>
      <button data-met="anuncio" class="${metFilter==="anuncio"?"on":""}">Anuncios</button>
    </div>
  </div>
  <div class="kpi4" style="margin-bottom:16px">
    <div class="kpi"><div class="l">Vistas</div><div class="v tnum">${num(vistas)}</div></div>
    <div class="kpi"><div class="l">Alcance</div><div class="v tnum">${num(alcance)}</div></div>
    <div class="kpi"><div class="l">Engagement</div><div class="v tnum">${eng.toFixed(1)}%</div></div>
    <div class="kpi"><div class="l">Ventas atribuidas</div><div class="v tnum">${uni} u</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1.5fr 1fr">
    <div class="card pad"><div class="section-h"><h2>Vistas por semana</h2></div>${vbars(weeks,{fmt:kfmt})}</div>
    <div class="card pad"><div class="section-h"><h2>Interacciones</h2></div>${hbars(engData,{fmt:kfmt})}
      <div class="muted" style="font-size:11.5px;margin-top:12px">Total ${num(likes+coment+guard+comp)} interacciones sobre ${num(alcance)} de alcance</div></div>
  </div>
  ${adsBlock}`;
};

/* ---------- REPORTES ---------- */
let reportCorte=fmtISO(HOY);
function fmtISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
Views.reportes=()=>{
  const corte=pd(reportCorte);
  const ini=addDays(corte,-28), fin=addDays(corte,-7); // ventana: 3 semanas, excluye los últimos 7 días
  const enVentana=publicados().filter(c=>{const d=pd(c.fecha);return d>=ini&&d<fin;});
  const recientes=publicados().filter(c=>{const d=pd(c.fecha);return d>=fin&&d<=corte;});
  const byVistas=[...enVentana].sort((a,b)=>b.vistas-a.vistas);
  const byVentas=[...enVentana].sort((a,b)=>ingresosItem(b)-ingresosItem(a));
  const totV=enVentana.reduce((s,c)=>s+c.vistas,0),totU=enVentana.reduce((s,c)=>s+unidades(c),0),totIng=enVentana.reduce((s,c)=>s+ingresosItem(c),0);
  const pt=productTotals(enVentana);
  const gasto=enVentana.reduce((s,c)=>s+(c.gastoAnuncio||0),0);

  const top=byVistas.slice(0,5).map((c,i)=>`<tr>
    <td><div class="ct-name"><div class="ti" style="background:${i===0?'var(--warn-soft)':'var(--surface-3)'};color:${i===0?'var(--warn)':'var(--muted)'};font-weight:800">${i+1}</div><div><b>${esc(c.titulo)}</b><small>${fdate(c.fecha)} · ${canalTxt(c.canal)}</small></div></div></td>
    <td class="tnum" style="font-weight:700">${num(c.vistas)}</td>
    <td class="tnum">${unidades(c)} u</td>
    <td class="tnum">${money(ingresosItem(c))}</td>
  </tr>`).join("")||`<tr><td colspan="4"><div class="empty">No hay piezas publicadas en esa ventana de 3 semanas.</div></td></tr>`;

  const metasEval=state.metas.map(m=>{const act=metaActual(m),pct=Math.round(act/m.objetivo*100),ok=act>=m.objetivo;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-2)">
      <span style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:${ok?'var(--good-soft)':'var(--surface-3)'};color:${ok?'var(--good)':'var(--muted)'};font-weight:800;font-size:12px">${ok?"✓":pct+"%"}</span>
      <span style="flex:1;font-weight:600;font-size:13px">${esc(m.titulo)}</span>
      <span class="muted tnum" style="font-size:12.5px">${m.metrica==="ingresos"?money(act):num(act)} / ${m.metrica==="ingresos"?money(m.objetivo):num(m.objetivo)}</span>
    </div>`;}).join("");

  const best=byVentas[0];
  return `
  <div class="section-h no-print">
    <div><div class="eyebrow">Reporte rodante de 4 semanas</div><h2 style="font-size:19px">Reporte de contenido</h2></div>
    <span class="sp"></span>
    <label class="muted" style="font-size:12px">Fecha de corte</label>
    <input type="date" id="corteInput" value="${reportCorte}" class="btn sm" style="padding:7px 10px">
    <button class="btn sm" data-action="printReport">Imprimir / PDF</button>
  </div>

  <div class="card pad" style="margin-bottom:16px;background:var(--surface-2);border-style:dashed">
    <div style="display:flex;gap:14px;align-items:flex-start">
      <div style="flex:none;width:34px;height:34px;border-radius:10px;background:var(--info-soft);color:var(--info);display:grid;place-items:center">${icon("reportes",18)}</div>
      <div style="font-size:12.5px;line-height:1.55">
        <b>Cómo se arma:</b> al cortar el <b>${fdatel(reportCorte)}</b>, el reporte evalúa el contenido publicado entre el <b>${fdate(fmtISO(ini))}</b> y el <b>${fdate(fmtISO(fin))}</b> — las <b>3 semanas anteriores</b> a la última.
        Los ${recientes.length} reel${recientes.length!==1?"s":""} de los últimos 7 días quedan <b>afuera</b> porque recién los subiste y todavía no maduraron.
      </div>
    </div>
  </div>

  <div id="reportPrint">
    <div class="kpi4" style="margin-bottom:16px">
      <div class="kpi"><div class="l">Piezas evaluadas</div><div class="v tnum">${enVentana.length}</div></div>
      <div class="kpi"><div class="l">Vistas del período</div><div class="v tnum">${num(totV)}</div></div>
      <div class="kpi"><div class="l">Unidades vendidas</div><div class="v tnum">${totU} u</div></div>
      <div class="kpi"><div class="l">Ingresos${gasto?" (neto ads)":""}</div><div class="v tnum">${money(totIng-gasto)}</div></div>
    </div>

    ${best?`<div class="banner" style="background:linear-gradient(100deg,#12B3A3,#2E8FD6)">
      <div class="bic">🏆</div>
      <div class="bt"><b>Mejor pieza del período: ${esc(best.titulo)}</b><p>${num(best.vistas)} vistas · ${unidades(best)} unidades · ${money(ingresosItem(best))} en ventas</p></div>
    </div>`:""}

    <div class="grid" style="grid-template-columns:1.4fr 1fr;margin-bottom:16px">
      <div class="tablecard">
        <div class="th"><h2>Top contenido por alcance</h2></div>
        <div class="wrap"><table class="dt"><thead><tr><th>Contenido</th><th>Vistas</th><th>Ventas</th><th>Ingresos</th></tr></thead><tbody>${top}</tbody></table></div>
      </div>
      <div class="card pad"><div class="section-h"><h2>Ventas por producto</h2></div>
        ${hbars(PRODUCTOS.map(p=>({l:p.nombre.replace("Quita ",""),v:pt[p.id],c:p.color})),{unit:" u"})}
      </div>
    </div>

    <div class="card pad">
      <div class="section-h"><h2>Estado de las metas al corte</h2></div>
      ${metasEval||'<div class="empty">Sin metas cargadas.</div>'}
    </div>
  </div>`;
};
function canalTxt(c){return c==="anuncio"?"Anuncio":"Orgánico";}

/* ---------- RECORDATORIOS ---------- */

  const r=reminders();
  const item=(o,tag,tagC,icono)=>`<div class="card pad" style="display:flex;align-items:center;gap:13px;margin-bottom:10px">
    <div style="flex:none;width:38px;height:38px;border-radius:11px;background:${tagC.bg};color:${tagC.c};display:grid;place-items:center">${icono}</div>
    <div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(o.c.titulo)}</b><div class="muted" style="font-size:12px">${TIPOS[o.c.tipo]} · publicado el ${fdatel(o.c.fecha)}</div></div>
    <span class="chip" style="background:${tagC.bg};color:${tagC.c}">${tag}</span>
    <button class="btn sm pri" data-open="${o.c.id}">Cargar métricas</button>
  </div>`;

  const bell=`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>`;

  const secc=(titulo,arr,render)=>arr.length?`<div class="section-h" style="margin-top:22px"><h2>${titulo}</h2><span class="chip" style="background:var(--surface-3);color:var(--muted)">${arr.length}</span></div>${arr.map(render).join("")}`:"";

  const nada=(r.vencidos.length+r.porVencer.length+r.atrasadosPub.length+r.metas.length)===0;

  return `
  <div class="section-h"><div><div class="eyebrow">Plazos automáticos</div><h2 style="font-size:19px">Recordatorios</h2></div></div>
  <div class="card pad" style="margin-bottom:6px;background:var(--surface-2);border-style:dashed;font-size:12.5px;line-height:1.5">
    Cada pieza publicada te da <b>${state.config.diasMetricas||4} días</b> para cargar sus métricas y ventas. Pasado el plazo aparece acá para que no se te escape ningún reel antes del reporte. <span class="muted">(Cambiá los días en Configuración.)</span>
  </div>
  ${nada?`<div class="card" style="margin-top:14px"><div class="empty">${bell}<div><b>Todo al día.</b><br>No tenés métricas pendientes ni plazos vencidos.</div></div></div>`:""}
  ${secc("Plazo vencido — cargá métricas ya",r.vencidos,o=>item(o,`Venció hace ${o.dias}d`,{bg:"var(--bad-soft)",c:"var(--bad)"},bell))}
  ${secc("Por vencer",r.porVencer,o=>item(o,`En ${o.dias}d`,{bg:"var(--warn-soft)",c:"var(--warn)"},bell))}
  ${r.atrasadosPub.length?`<div class="section-h" style="margin-top:22px"><h2>Deberías haber publicado</h2><span class="chip" style="background:var(--surface-3);color:var(--muted)">${r.atrasadosPub.length}</span></div>`+r.atrasadosPub.map(o=>`<div class="card pad" style="display:flex;align-items:center;gap:13px;margin-bottom:10px"><div style="flex:none;width:38px;height:38px;border-radius:11px;background:var(--info-soft);color:var(--info);display:grid;place-items:center">${icon("contenido",18)}</div><div style="flex:1"><b style="font-size:13.5px">${esc(o.c.titulo)}</b><div class="muted" style="font-size:12px">Estaba para el ${fdatel(o.c.fecha)} · estado: ${ESTADOS[o.c.estado].t}</div></div><button class="btn sm" data-open="${o.c.id}">Abrir</button></div>`).join(""):""}
  ${r.metas.length?`<div class="section-h" style="margin-top:22px"><h2>Metas por vencer</h2><span class="chip" style="background:var(--surface-3);color:var(--muted)">${r.metas.length}</span></div>`+r.metas.map(o=>`<div class="card pad" style="display:flex;align-items:center;gap:13px;margin-bottom:10px"><div style="flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center">${icon("metas",18)}</div><div style="flex:1"><b style="font-size:13.5px">${esc(o.m.titulo)}</b><div class="muted" style="font-size:12px">Vence el ${fdatel(o.m.fechaLimite)} · vas ${Math.round(o.pct)}%</div></div><span class="chip" style="background:var(--warn-soft);color:var(--warn)">Faltan ${o.dias}d</span><button class="btn sm" data-view="metas">Ver</button></div>`).join(""):""}`;
};

/* ============================================================
   BÚSQUEDA INTELIGENTE
   Entiende nombres de producto, tipos de reel, frameworks, estados,
   canal y atajos ("sin metricas", "listo", "vendio") además del
   texto libre del título y las notas. Puntúa y ordena por relevancia.
   ============================================================ */
const normaliza=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
/** Sinónimos -> qué campo y valor matchean. Es lo que la hace "entender". */
const ATAJOS=[
  {kw:["sarro","quitasarro"],       campo:"producto", val:"sarro"},
  {kw:["moho","hongo","humedad"],   campo:"producto", val:"moho"},
  {kw:["oxido","oxidado","herrumbre"],campo:"producto",val:"oxido"},
  {kw:["vidrio","vidrios","ventana"],campo:"producto",val:"vidrios"},
  {kw:["combo","varios"],           campo:"producto", val:"combo"},
  {kw:["venta","vende","vendedor"], campo:"tipo",     val:"venta"},
  {kw:["valor","educativo"],        campo:"tipo",     val:"valor"},
  {kw:["tendencia","trend","moda"], campo:"tipo",     val:"tendencia"},
  {kw:["anuncio","pauta","pago","ads"],campo:"canal", val:"anuncio"},
  {kw:["organico"],                 campo:"canal",    val:"organico"},
  {kw:["publicado"],                campo:"estado",   val:"publicado"},
  {kw:["idea","ideas"],             campo:"estado",   val:"idea"},
  {kw:["guion","guiones"],          campo:"estado",   val:"guion"},
  {kw:["grabado"],                  campo:"estado",   val:"grabado"},
  {kw:["programado"],               campo:"estado",   val:"programado"},
  {kw:["pas"],                      campo:"framework",val:"pas"},
  {kw:["before","after","antes","despues","transformacion"],campo:"framework",val:"before_after"},
  {kw:["razones"],                  campo:"framework",val:"tres_razones"},
  {kw:["desmitificando","truco","trucos","casero"],campo:"framework",val:"desmitificando"},
  {kw:["fundador","origen","historia"],campo:"framework",val:"fundador"},
];
function buscar(q){
  const raw=normaliza(q).trim();
  if(!raw)return {contenido:[],metas:[],q:""};
  const tokens=raw.split(/\s+/).filter(Boolean);
  // atajos especiales que no son campo=valor
  const pideSinMetricas=/sin metrica|falta metrica|pendiente/.test(raw);
  const pideVendio=/vendio|vendidos|con venta/.test(raw);
  const pideListo=/listo|para anunciar|pautar/.test(raw);
  const refs=adsRefs();

  const res=state.contenido.map(c=>{
    let sc=0;const razones=[];
    const texto=normaliza(`${c.titulo} ${c.notas||""} ${c.pilar||""}`);
    tokens.forEach(t=>{
      if(texto.includes(t))sc+=t.length>=4?6:3;
      ATAJOS.forEach(a=>{
        if(!a.kw.includes(t))return;
        if(a.campo==="producto"&&(c.producto||"general")===a.val){sc+=8;razones.push(CMAP[a.val]?.nombre);}
        if(a.campo==="tipo"&&(c.tipos||[]).includes(a.val)){sc+=7;razones.push(TIPOS_REEL[a.val].t);}
        if(a.campo==="canal"&&c.canal===a.val){sc+=6;razones.push(a.val==="anuncio"?"Anuncio":"Orgánico");}
        if(a.campo==="estado"&&c.estado===a.val){sc+=6;razones.push(ESTADOS[a.val]?.t);}
        if(a.campo==="framework"&&c.framework===a.val){sc+=7;razones.push(FRAMEWORKS[a.val]?.t.split(" ·")[0]);}
      });
    });
    if(pideSinMetricas&&c.estado==="publicado"&&!c.metricasCargadas){sc+=10;razones.push("sin métricas");}
    if(pideVendio&&unidades(c)>0){sc+=10;razones.push(`${unidades(c)} u vendidas`);}
    if(pideListo&&adsEval(c,refs).estado==="listo"){sc+=12;razones.push("listo para anunciar");}
    return {c,sc,razones:[...new Set(razones.filter(Boolean))]};
  }).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,12);

  const metas=state.metas.filter(m=>tokens.some(t=>normaliza(m.titulo).includes(t))).slice(0,4);
  return {contenido:res,metas,q};
}
function renderBusqueda(q){
  const box=document.getElementById("searchResults");if(!box)return;
  const {contenido,metas}=buscar(q);
  if(!q.trim()){box.hidden=true;box.innerHTML="";return;}
  if(!contenido.length&&!metas.length){
    box.hidden=false;
    box.innerHTML=`<div class="muted" style="padding:16px;font-size:12.5px">Nada para “${esc(q)}”. Probá con un producto (moho, sarro), un tipo (venta, tendencia) o “sin métricas”.</div>`;
    return;
  }
  box.hidden=false;
  box.innerHTML=`
    ${contenido.map(({c,razones})=>{
      const carp=CMAP[c.producto]||CMAP.general;
      return `<button class="sr-item" data-open="${c.id}">
        <span style="width:8px;height:8px;border-radius:2px;background:${carp.color};flex:none"></span>
        <span style="flex:1;min-width:0">
          <b style="display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.titulo)}</b>
          <small class="muted" style="font-size:11px">${carp.nombre} · ${fdate(c.fecha)}${razones.length?" · "+razones.slice(0,3).join(" · "):""}</small>
        </span>
        ${unidades(c)?`<span class="chip" style="background:var(--good-soft);color:var(--good)">${unidades(c)} u</span>`:""}
        ${estadoChip(c.estado)}
      </button>`;}).join("")}
    ${metas.map(m=>`<button class="sr-item" data-view="metas">
        <span style="width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none"></span>
        <span style="flex:1"><b style="display:block;font-size:13px">${esc(m.titulo)}</b><small class="muted" style="font-size:11px">Meta</small></span>
      </button>`).join("")}`;
}

/* ============================================================
   COMPARADOR DE PIEZAS
   Pensado para el flujo real: se hacen varias versiones del mismo
   reel y hay que ver cuál funcionó mejor — no solo en alcance, sino
   en lo que termina importando, que es si vendió.
   ============================================================ */
let comparar=[];   // ids seleccionados (máx 4)

/** Quita "Versión 2", "V3" del título para agrupar variantes del mismo reel. */
function tituloBase(t){
  return normaliza(t).replace(/\s*[-–·|]?\s*(versi[oó]n|version|vers|v)\s*\.?\s*\d+\s*$/i,"")
    .replace(/\s*[-–·|]\s*(final|nuevo|nueva|copia)\s*$/i,"").trim();
}
/** Grupos de versiones detectados automáticamente (2+ piezas con el mismo título base). */
function gruposDeVersiones(){
  const m={};
  state.contenido.forEach(c=>{const k=tituloBase(c.titulo);(m[k]=m[k]||[]).push(c);});
  return Object.entries(m).filter(([,arr])=>arr.length>1)
    .map(([k,arr])=>({base:k,arr:arr.sort((a,b)=>pd(a.fecha)-pd(b.fecha))}));
}

/** Filas de la tabla comparativa. Las marcadas "clave" son las que deciden. */
const METRICAS_CMP=[
  {l:"Alcance",            get:c=>c.alcance||0,                                   fmt:num},
  {l:"Vistas",             get:c=>c.vistas||0,                                    fmt:num},
  {l:"Retención (vistas/alcance)",get:c=>c.alcance?c.vistas/c.alcance:0,          fmt:v=>v.toFixed(2)+"×", tasa:true},
  {l:"Likes",              get:c=>c.likes||0,                                     fmt:num},
  {l:"Comentarios",        get:c=>c.comentarios||0,                               fmt:num},
  {l:"Guardados",          get:c=>c.guardados||0,                                 fmt:num},
  {l:"Compartidos",        get:c=>c.compartidos||0,                               fmt:num},
  {l:"Intención (guard+comp / alcance)",get:c=>c.alcance?((c.guardados||0)+(c.compartidos||0))/c.alcance:0,fmt:v=>(v*100).toFixed(2)+"%", tasa:true},
  {l:"Seguidores que trajo",get:c=>c.seguidoresGanados||0,                        fmt:v=>"+"+num(v)},
  {l:"Unidades vendidas",  get:c=>unidades(c),                                    fmt:v=>v+" u", clave:true},
  {l:"Conversión",         get:c=>c.alcance?unidades(c)/c.alcance:0,              fmt:v=>(v*100).toFixed(2)+"%", clave:true, tasa:true},
  {l:"Ingresos",           get:c=>ingresosItem(c),                                fmt:money},
  {l:"Ingreso por 1.000 de alcance",get:c=>c.alcance?ingresosItem(c)/c.alcance*1000:0,fmt:money, clave:true, tasa:true},
  {l:"Puntaje para pautar",get:c=>adsEval(c).score,                               fmt:v=>v+"/100", clave:true, tasa:true},
];

Views.comparar=()=>{
  const sel=comparar.map(id=>state.contenido.find(c=>c.id===id)).filter(Boolean);
  const grupos=gruposDeVersiones();

  const chips=[...state.contenido].sort((a,b)=>pd(b.fecha)-pd(a.fecha)).map(c=>{
    const on=comparar.includes(c.id), carp=CMAP[c.producto]||CMAP.general;
    return `<button class="btn sm" data-cmp="${c.id}" style="border-color:${on?"var(--accent)":"var(--border)"};background:${on?"var(--accent-soft)":"var(--surface)"};color:${on?"var(--accent-ink)":"var(--text)"}">
      <span style="width:7px;height:7px;border-radius:2px;background:${carp.color};display:inline-block"></span>
      ${esc(c.titulo)}</button>`;}).join("");

  let tabla="",conclusion="";
  if(sel.length>=2){
    const cab=sel.map(c=>{
      const ev=adsEval(c),st=ADS_ESTADOS[ev.estado]||ADS_ESTADOS.no,carp=CMAP[c.producto]||CMAP.general;
      return `<th style="min-width:180px;text-align:left;padding:14px 16px;vertical-align:top">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <b style="font-size:13.5px;color:var(--text)">${esc(c.titulo)}</b>
          ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:var(--accent-ink);display:inline-flex">${icon("play",14)}</a>`:""}
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">
          <span class="chip" style="background:color-mix(in srgb,${carp.color} 14%,transparent);color:${carp.color}">${carp.nombre}</span>
          ${tipoChips(c.tipos)}
        </div>
        <div class="muted" style="font-weight:500;font-size:11px;margin-top:6px;text-transform:none;letter-spacing:0">
          ${fdatel(c.fecha)} · ${TIPOS[c.tipo]} · ${c.canal==="anuncio"?"Anuncio":"Orgánico"}<br>
          ${c.framework&&FRAMEWORKS[c.framework]?FRAMEWORKS[c.framework].t:"Framework sin definir"}
        </div>
        <span class="chip" style="background:${st.bg};color:${st.c};margin-top:7px">${st.t}</span>
      </th>`;}).join("");

    const conf=sel.map(esConfiable);
    const filas=METRICAS_CMP.map(m=>{
      // una tasa sobre poco alcance no se compara: se muestra s/d y no compite por ganar
      const vals=sel.map((c,i)=>(m.tasa&&!conf[i])?null:m.get(c));
      const validos=vals.filter(v=>v!==null);
      const max=validos.length?Math.max(...validos):0;
      const hayDif=max>0&&validos.some(v=>v!==max);
      return `<tr>
        <td style="font-weight:600;font-size:12.5px;${m.clave?"color:var(--text)":"color:var(--muted)"}">${m.l}${m.clave?' <span class="chip" style="background:var(--accent-soft);color:var(--accent-ink);font-size:9.5px">clave</span>':""}</td>
        ${vals.map(v=>{
          if(v===null)return `<td class="muted" style="font-size:12px" title="Alcance insuficiente para leer esta tasa">s/d</td>`;
          const gana=max>0&&v===max&&hayDif;
          const dif=(max>0&&v!==max)?` <small class="muted">(${Math.round((v-max)/max*100)}%)</small>`:"";
          return `<td class="tnum" style="font-weight:${gana?"800":"600"};color:${gana?"var(--good)":"var(--text)"}">${m.fmt(v)}${gana?" ▲":dif}</td>`;
        }).join("")}
      </tr>`;}).join("");

    const aviso=conf.includes(false)?`<div class="card pad" style="margin-bottom:12px;background:var(--warn-soft);border-color:var(--warn)">
      <div style="font-size:12.5px;color:var(--warn)"><b>Ojo:</b> ${sel.filter((c,i)=>!conf[i]).map(c=>esc(c.titulo)).join(", ")} no llega${sel.filter((c,i)=>!conf[i]).length>1?"n":""} al alcance mínimo (${num(alcanceMinimo())}). Sus tasas salen s/d porque con tan poca gente cualquier porcentaje es ruido — los números absolutos sí se muestran.</div>
    </div>`:"";
    tabla=aviso+`<div class="tablecard"><div class="wrap"><table class="dt cmp">
      <thead><tr><th style="min-width:190px">Métrica</th>${cab}</tr></thead>
      <tbody>${filas}</tbody></table></div></div>`;

    // la lectura separa "ganó en alcance" de "ganó vendiendo", que es lo que confunde
    const porAlcance=[...sel].sort((a,b)=>(b.alcance||0)-(a.alcance||0))[0];
    const porConv=[...sel].sort((a,b)=>{
      const ca=a.alcance?unidades(a)/a.alcance:0, cb=b.alcance?unidades(b)/b.alcance:0;return cb-ca;})[0];
    const porScore=[...sel].sort((a,b)=>adsEval(b).score-adsEval(a).score)[0];
    let txt;
    if(!sel.some(c=>unidades(c)>0)){
      txt=`Ninguna vendió todavía, así que esto compara alcance y señales. <b>${esc(porAlcance.titulo)}</b> llegó a más gente. Ojo: más alcance no significa que venda mejor — eso recién se sabe cuando alguna registre ventas.`;
    }else if(porAlcance.id!==porConv.id){
      txt=`Acá está lo interesante: <b>${esc(porAlcance.titulo)}</b> ganó en alcance, pero <b>${esc(porConv.titulo)}</b> convierte mejor por persona alcanzada. Para pautar conviene la segunda — el alcance se compra, la conversión no.`;
    }else{
      txt=`<b>${esc(porConv.titulo)}</b> gana en alcance y en conversión a la vez. Es la versión a repetir y la candidata natural para pautar.`;
    }
    conclusion=`<div class="card pad" style="margin-top:16px;border-left:3px solid var(--accent)">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center">${icon("metricas",17)}</div>
        <div><b style="font-size:13.5px">Lectura</b>
          <div class="muted" style="font-size:12.5px;line-height:1.55;margin-top:4px">${txt}</div>
          <div class="muted" style="font-size:11.5px;margin-top:7px">Mejor puntaje para pautar: <b style="color:var(--text)">${esc(porScore.titulo)}</b> (${adsEval(porScore).score}/100)</div>
        </div>
      </div></div>`;
  }

  return `
  <div class="section-h">
    <div><div class="eyebrow">Versiones y variantes</div><h2 style="font-size:19px">Comparar piezas</h2></div>
    <span class="sp"></span>
    ${comparar.length?`<button class="btn sm" data-action="limpiarCmp">Limpiar</button>`:""}
  </div>

  ${grupos.length?`<div class="card pad" style="margin-bottom:16px">
    <div class="eyebrow" style="margin-bottom:10px">Versiones detectadas</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${grupos.map((g,i)=>`<button class="btn sm pri" data-grupo="${i}">${esc(g.arr[0].titulo.replace(/\s*[-–·|]?\s*(versi[oó]n|version|v)\s*\.?\s*\d+\s*$/i,""))} · ${g.arr.length} versiones</button>`).join("")}
    </div>
    <div class="muted" style="font-size:11.5px;margin-top:9px">Las detecta por el título. Un click y las compara todas.</div>
  </div>`:""}

  <div class="card pad" style="margin-bottom:16px">
    <div class="eyebrow" style="margin-bottom:10px">Elegí 2 a 4 piezas ${comparar.length?`· <span style="color:var(--accent-ink)">${comparar.length} seleccionada${comparar.length!==1?"s":""}</span>`:""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${chips||`<span class="muted" style="font-size:12.5px">Todavía no hay contenido cargado.</span>`}</div>
  </div>

  ${sel.length>=2?tabla+conclusion
    :`<div class="card"><div class="empty">${icon("metricas",30)}<div>Elegí al menos 2 piezas para compararlas.</div></div></div>`}`;
};

/* ---------- META ADS ---------- */
function tipoChips(tipos){
  if(!tipos||!tipos.length)return `<span class="chip" style="background:var(--surface-3);color:var(--muted-2)">sin tipo</span>`;
  return tipos.map(k=>{const v=TIPOS_REEL[k];return v?`<span class="chip" style="background:${v.bg};color:${v.c}">${v.t}</span>`:"";}).join(" ");
}
Views.ads=()=>{
  const rank=adsRanking();
  const por=(e)=>rank.filter(r=>r.ev.estado===e);
  const listos=por("listo"), candidatos=por("candidato"), marca=por("marca"),
        anunciando=por("anunciando"), noRec=por("no"), sinDatos=por("insuficiente"),
        cerrados=[...por("anunciado"),...por("descartado")];

  const card=(r,{acciones=true}={})=>{
    const {it,ev}=r, st=ADS_ESTADOS[ev.estado]||ADS_ESTADOS.no, carp=CMAP[it.producto]||CMAP.general;
    return `<div class="card pad" style="margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:none;width:44px;height:44px;border-radius:12px;background:${st.bg};color:${st.c};display:grid;place-items:center;font-weight:800;font-size:15px" class="tnum">${ev.score}</div>
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <b style="font-size:14px">${esc(it.titulo)}</b>
            ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" title="Ver el video" style="color:var(--accent-ink);display:inline-flex">${icon("play",15)}</a>`:""}
            <span class="chip" style="background:color-mix(in srgb,${carp.color} 14%,transparent);color:${carp.color}">${carp.nombre}</span>
            ${tipoChips(it.tipos)}
          </div>

  const secc=(titulo,arr,desc,acciones=true)=>arr.length?`

        Tres reglas mandan por encima del puntaje:
        <b>1)</b> una pieza sin estructura de venta nunca se recomienda pautar, por más alcance que tenga — un reel de tendencia vuela y trae seguidores sin mostrar el dolor que hace comprar.
        <b>2)</b> por debajo del alcance mínimo no se puntúa: con poca gente cualquier porcentaje es ruido, y si vos mismo compartís la pieza, la inflás sin querer.

  document.querySelectorAll(".tipochip").forEach(btn=>{
