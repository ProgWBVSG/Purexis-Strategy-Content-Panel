        <span style="flex:1"><b style="display:block;font-size:13px">${esc(m.titulo)}</b><small class="muted" style="font-size:11px">Meta</small></span>
      </button>`).join("")}`;
}

/* ============================================================
   DIAGNOSTICO — por que a esta pieza le fue como le fue.
   Recorre el embudo de arriba hacia abajo y frena en el primer
   eslabon que no pasa. El orden no es estetico: si el gancho no
   retuvo, el medio del reel nunca llego a jugarse y culparlo seria
   diagnosticar mal.
   ============================================================ */
const pct=v=>(v*100).toFixed(1)+"%";
const DIAG_NIVEL={
  ok:      {t:"Funcionó",       c:"var(--good)",  bg:"var(--good-soft)"},
  aviso:   {t:"A medias",       c:"var(--warn)",  bg:"var(--warn-soft)"},
  malo:    {t:"Falló",          c:"var(--bad)",   bg:"var(--bad-soft)"},
  sindatos:{t:"Sin diagnóstico",c:"var(--muted)", bg:"var(--surface-3)"},
};

function diagnostico(it){
  const E=embudo(it), alc=it.alcance||0, uni=unidades(it), faltan=faltantes(it);
  const med=[];   // las mediciones que sí se pudieron hacer, para mostrar el número crudo
  if(E.gancho!=null)    med.push({k:"Gancho",   v:E.gancho,    ref:EMBUDO.ganchoMin});
  if(E.retencion!=null) med.push({k:"Retención",v:E.retencion, ref:E.retencionMin});
  if(E.envios!=null)    med.push({k:"Envíos",   v:E.envios,    ref:EMBUDO.enviosMin});
  const base={medidas:med,faltan};

  if(it.estado!=="publicado")
    return Object.assign({},base,{nivel:"sindatos",etapa:"—",titulo:"Todavía no está publicada",
      detalle:"El diagnóstico corre sobre piezas publicadas.",accion:""});

  if(!it.metricasCargadas)
    return Object.assign({},base,{nivel:"sindatos",etapa:"—",titulo:"Faltan las métricas",
      detalle:"Sin números no hay nada que leer.",
      accion:"Abrí las estadísticas del reel y cargá al menos alcance, impresiones, duración y tiempo medio."});

  if(alc<alcanceMinimo())
    return Object.assign({},base,{nivel:"sindatos",etapa:"alcance",titulo:`Solo ${num(alc)} de alcance`,
      detalle:`Con tan poca gente cualquier porcentaje es ruido: dos compartidos sobre ocho personas dan 25% y no significan nada. El mínimo para leer algo es ${num(alcanceMinimo())}.`,
      accion:"No hay nada que corregir acá. La pieza no llegó a distribuirse lo suficiente como para dejar señal."});

  // ETAPA 1 — el gancho. Si no pasa, nada de lo que sigue tuvo oportunidad.
  if(E.gancho!=null && E.gancho<EMBUDO.ganchoMin)
    return Object.assign({},base,{nivel:"malo",etapa:"gancho",
      titulo:`El gancho no pasó: ${pct(E.gancho)}`,
      detalle:`De cada 100 personas a las que Instagram se lo mostró, solo ${Math.round(E.gancho*100)} se quedaron a mirarlo. El mínimo es ${pct(EMBUDO.ganchoMin)}. La decisión de quedarse o seguir scrolleando se toma en 1,7 segundos: esto se define antes de que empiece el contenido.`,
      accion:"Reescribí solo los primeros 3 segundos, nada más. Probá abrir con el resultado ya resuelto — el después del antes/después — en vez de presentar el problema. Si el reel abre explicando, ya perdiste."});

  // ETAPA 2 — la retención. El gancho funcionó; el problema está en el medio.
  if(E.retencion!=null && E.retencion<E.retencionMin)
    return Object.assign({},base,{nivel:"malo",etapa:"retencion",
      titulo:`Se cayó en el medio: retuvo ${pct(E.retencion)}`,
      detalle:`El gancho funcionó${E.gancho!=null?` (${pct(E.gancho)})`:""} pero se quedaron ${(it.tiempoMedioSeg||0).toFixed(1)}s de ${it.duracionSeg}s. Para un reel de esta duración el piso es ${pct(E.retencionMin)}. El problema no está en la apertura ni en el cierre: está en el medio.`,
      accion:"Sacá el aire muerto y adelantá la transformación. Si el momento en que se ve el resultado llega después de la mitad, llegó tarde."});

  // ETAPA 3 — los envíos. Retuvo, pero no dio ganas de mostrárselo a nadie.
  if(E.envios!=null && E.envios<EMBUDO.enviosMin)
    return Object.assign({},base,{nivel:"aviso",etapa:"envios",
      titulo:"Retuvo, pero nadie lo mandó",
      detalle:`${num(it.envios||0)} envíos por mensaje sobre ${num(alc)} de alcance (${pct(E.envios)}). Los envíos pesan entre 3 y 5 veces más que un like para que Instagram lo reparta, y son lo que hace que salga de tus seguidores.`,
      accion:"Falta el momento de mostrárselo a alguien: un dato que sorprenda, o un resultado tan visible que dé ganas de mandárselo a la persona que tiene ese problema en su casa."});

  // ETAPA 4 — retuvo y viajó. ¿Generó interés? ¿Y cerró?
  const tieneVenta=(it.tipos||[]).includes("venta");
  const posibles=it.posiblesClientes||0;

  // Generó consultas y no cerró ninguna: el reel hizo su trabajo, el problema
  // está después del reel. No hay que tocar el contenido.
  if(uni===0 && posibles>0)
    return Object.assign({},base,{nivel:"aviso",etapa:"cierre",
      titulo:`Generó ${posibles} ${posibles===1?"consulta":"consultas"} y no cerró ninguna`,
      detalle:"El reel hizo su trabajo: pasó el embudo y la gente preguntó. Lo que se cae está después — el precio, la respuesta, o una objeción que no se resolvió. Cambiar el reel acá sería arreglar lo que no está roto."
        +(posibles<CIERRE.minPieza?` Ojo: con ${posibles} ${posibles===1?"consulta":"consultas"} todavía puede ser azar; recién desde ${CIERRE.minPieza} el dato pesa.`:" Con este volumen ya no es casualidad."),
      accion:posibles>=CIERRE.minPieza
        ? "Revisá esas conversaciones y buscá dónde se cortan. La objeción que más se repite es la que tenés que responder dentro del próximo reel, antes de que la hagan."
        : "Anotá qué preguntaron. Cuando junten unas cuantas vas a ver si se repite siempre la misma objeción."});

  if(uni===0 && tieneVenta)
    return Object.assign({},base,{nivel:"aviso",etapa:"conversion",
      titulo:"Funcionó como contenido, falló como venta",
      detalle:"Pasó las tres etapas del embudo, nadie preguntó y no vendió. El problema ya no es la atención: es que la atención no se convirtió en interés de compra.",
      accion:"Revisá dos cosas: si el reel muestra el dolor con la escena concreta en vez del producto, y si hay un solo CTA al final. Dos CTAs es lo mismo que ninguno."});

  if(uni===0)
    return Object.assign({},base,{nivel:"aviso",etapa:"estructura",
      titulo:"Buenas señales, sin estructura de venta",
      detalle:"Retuvo y se compartió, pero está marcada como valor o tendencia. Ese alcance no está pensado para convertir.",
      accion:"Si el tema funcionó, hacé una versión con estructura de venta: mismo tema, apertura de dolor y un CTA."});

  const cierre=posibles>0 ? uni/(uni+posibles) : null;
  return Object.assign({},base,{nivel:"ok",etapa:"completo",
    titulo:`Funcionó de punta a punta: ${uni} ${uni===1?"unidad":"unidades"}`,
    detalle:`Retuvo${E.retencion!=null?` (${pct(E.retencion)})`:""}, se compartió${E.envios!=null?` (${pct(E.envios)} de envíos)`:""} y vendió.`
      +(cierre!=null?` De ${uni+posibles} personas que preguntaron cerraste ${uni}: ${pct(cierre)} de cierre.`:"")
      +" Esta es la combinación que hay que repetir.",
    accion:cierre!=null&&cierre<0.5
      ? `Reversionala, y en paralelo mirá las ${posibles} consultas que no cerraron: ahí está la objeción que te falta responder.`
      : "Reversionala con otro producto o superficie, y evaluala para pautar."});
}

/* ---- Conversaciones ----
   Un interesado es alguien que pregunto por esa pieza y no compro.
   Las conversaciones totales de una pieza son interesados + ventas.
   Con pocas conversaciones no se puede juzgar el speech: dos consultas
   sin cerrar es azar, cincuenta sin cerrar es un problema de guion. */
const CIERRE={minPieza:5, minCuenta:10, tasaFloja:0.20, tasaBuena:0.40};
const interesados = it => it.posiblesClientes||0;
const conversaciones = it => interesados(it)+unidades(it);
const tasaCierre = it => conversaciones(it) ? unidades(it)/conversaciones(it) : null;

/** Lectura del speech de venta a nivel cuenta, no de una pieza suelta.
 *  Responde: el contenido trae gente que pregunta, y esa gente compra? */
function analisisCierre(items){
  const arr=(items||publicados());
  const totInt=arr.reduce((a,c)=>a+interesados(c),0);
  const totVen=arr.reduce((a,c)=>a+unidades(c),0);
  const totConv=totInt+totVen;
  const tasa=totConv?totVen/totConv:null;
  // la pieza que mas conversaciones genero: ese tema despierta demanda
  const masConsultada=[...arr].sort((a,b)=>conversaciones(b)-conversaciones(a))[0];
  const conVentas=arr.filter(c=>conversaciones(c)>0);
  const mejorCierre=[...conVentas].sort((a,b)=>(tasaCierre(b)||0)-(tasaCierre(a)||0))[0];

  let nivel,titulo,detalle,accion;
  if(totConv===0){
    nivel="sindatos"; titulo="Todavía no registraste conversaciones";
    detalle="Cargá cuántos interesados dejó cada pieza para poder separar un problema de contenido de uno de venta.";
    accion="";
  }else if(totConv<CIERRE.minCuenta){
    nivel="sindatos"; titulo=`Solo ${totConv} conversaciones registradas`;
    detalle=`Con menos de ${CIERRE.minCuenta} no se puede concluir nada del speech: dos consultas que no cierran es azar.`;
    accion="Seguí cargando interesados por pieza. Cuando pasen las 10, esto te dice si el problema es el contenido o la venta.";
  }else if(totVen===0){
    nivel="malo"; titulo=`${totConv} conversaciones y ninguna venta`;
    detalle="El contenido está haciendo su trabajo: trae gente que pregunta. Lo que no está cerrando es la conversación. Con este volumen ya no es casualidad — es el speech.";
    accion="Juntá las últimas 10 conversaciones y buscá en qué punto exacto se cortan: si es al decir el precio, si es al preguntar cómo se usa, o si se van sin responder. La objeción que más se repite es la que hay que responder antes de que la hagan.";
  }else if(tasa<CIERRE.tasaFloja){
    nivel="aviso"; titulo=`Cerrás ${pct(tasa)} de las conversaciones`;
    detalle=`${totVen} ventas sobre ${totConv} conversaciones. De cada 10 personas que te escriben, ${Math.round(tasa*10)} compran. Hay margen grande en la conversación, no en el contenido.`;
    accion="Mirá las que no cerraron y agrupá por motivo. Si el precio aparece seguido, el problema no es el precio: es que el valor no quedó claro antes de decirlo.";
  }else if(tasa<CIERRE.tasaBuena){
    nivel="aviso"; titulo=`Cerrás ${pct(tasa)} de las conversaciones`;
    detalle=`${totVen} de ${totConv}. Es un ritmo razonable, pero todavía se pierden más de la mitad.`;
    accion="Probá responder la objeción más repetida dentro del propio reel: el que llega ya convencido cierra solo.";
  }else{
    nivel="ok"; titulo=`Cerrás ${pct(tasa)} de las conversaciones`;
    detalle=`${totVen} de ${totConv}. El speech funciona: quien pregunta, compra. El límite ahora es cuánta gente pregunta, no cómo les vendés.`;
    accion="El cuello de botella se movió al contenido. Enfocá en piezas que generen más conversaciones, no en mejorar la venta.";
  }
  return {nivel,titulo,detalle,accion,totInt,totVen,totConv,tasa,masConsultada,mejorCierre};
}

/** Donde falla la cuenta en general, no una pieza suelta. Es la respuesta a
 *  "por que fallamos en el engagement": si 5 de 8 mueren en el gancho, el
 *  problema es de aperturas, no de temas. */
function patronDeFallas(){
  const pubs=publicados().filter(c=>c.metricasCargadas&&(c.alcance||0)>=alcanceMinimo());
  const por={gancho:0,retencion:0,envios:0,cierre:0,conversion:0,estructura:0,completo:0};
  pubs.forEach(c=>{const d=diagnostico(c); if(por[d.etapa]!==undefined)por[d.etapa]++;});
  const orden=["gancho","retencion","envios","cierre","conversion","estructura"];
  let peor=null,max=0;
  orden.forEach(k=>{if(por[k]>max){max=por[k];peor=k;}});
  return {total:pubs.length,por,peor,cuantas:max};
}
const PATRON_TXT={
  gancho:{t:"El cuello de botella está en las aperturas",
    d:"La mayoría de tus piezas no pasa los primeros 3 segundos. Es el arreglo más rentable que tenés a mano: no hay que cambiar los temas, solo cómo empiezan."},
  retencion:{t:"El cuello de botella está en el medio",
    d:"Los ganchos funcionan y la gente entra, pero se van antes de la mitad. Revisá el ritmo y en qué segundo aparece la transformación."},
  envios:{t:"Falta el motivo para compartir",
    d:"Retenés bien pero no te mandan los reels por mensaje, que es lo que los saca de tus seguidores."},
  cierre:{t:"El contenido funciona, el cierre no",
    d:"Tus reels generan consultas y las consultas no terminan en venta. El cuello de botella ya no está en el contenido: está en lo que pasa después del mensaje. Juntá las objeciones que se repiten — cada una es un reel."},
  conversion:{t:"Atención sí, compra no",
    d:"El contenido funciona y no convierte. El problema está en el dolor mostrado y en el CTA, no en el alcance."},
  estructura:{t:"Alcance sin intención de venta",
    d:"Lo que funciona son piezas de valor o tendencia. Traen gente, no compradores."},
};

/** Diagnostico de una pieza pautada: la plata cambia las preguntas. */
function diagAnuncio(it){
  const gasto=it.gastoAnuncio||0, ing=ingresosItem(it), uni=unidades(it);
  if(!gasto) return null;
  const roas=ing/gasto, costoUnidad=uni?gasto/uni:null;
  const cpm=(it.impresiones||0)?gasto/it.impresiones*1000:null;
  let nivel,titulo,accion;
  if(uni===0){
    nivel="malo"; titulo=`${money(gasto)} gastados, cero ventas`;
    accion="Cortala. Antes de volver a pautar este creativo, arreglá lo que marque el diagnóstico orgánico: pautar un reel que no convierte solo compra alcance.";
  }else if(roas<1){
    nivel="malo"; titulo=`ROAS ${roas.toFixed(2)}× — perdés plata`;
    accion=`Cada peso invertido devuelve ${money(roas)}. Cortala, o bajá el costo por unidad, hoy en ${money(costoUnidad)}.`;
  }else if(roas<2){
    nivel="aviso"; titulo=`ROAS ${roas.toFixed(2)}× — apenas cierra`;
    accion="Cubre el gasto pero deja poco margen. Probá otra apertura del mismo reel antes de escalar presupuesto.";
  }else{
    nivel="ok"; titulo=`ROAS ${roas.toFixed(2)}× — escalá`;
    accion=`Cada peso devuelve ${money(roas)}. Subí presupuesto de a poco y vigilá que el costo por unidad (${money(costoUnidad)}) no se dispare al ampliar público.`;
  }
  return {nivel,titulo,accion,roas,costoUnidad,cpm,gasto,ing};
}

/* ============================================================
   COMPARADOR DE PIEZAS
   Pensado para el flujo real: se hacen varias versiones del mismo
   reel y hay que ver cuál funcionó mejor — no solo en alcance, sino
   en lo que termina importando, que es si vendió.
   ============================================================ */
let comparar=[];   // ids seleccionados (máx 4)

/** Quita "Versión 2", "V3" del título para agrupar variantes del mismo reel. */
function tituloBase(t){
  return normaliza(t).replace(/\s*[-–·|]?\s*(versi[oó]n|version|vers|v)\s*\.?\s*\d+\s*$/i,"")
    .replace(/\s*[-–·|]\s*(final|nuevo|nueva|copia)\s*$/i,"").trim();
}
/** Grupos de versiones detectados automáticamente (2+ piezas con el mismo título base). */
function gruposDeVersiones(){
  const m={};
  state.contenido.forEach(c=>{const k=tituloBase(c.titulo);(m[k]=m[k]||[]).push(c);});
  return Object.entries(m).filter(([,arr])=>arr.length>1)
    .map(([k,arr])=>({base:k,arr:arr.sort((a,b)=>pd(a.fecha)-pd(b.fecha))}));
}

/** Filas de la tabla comparativa. Las marcadas "clave" son las que deciden. */
const METRICAS_CMP=[
  {l:"Alcance",            get:c=>c.alcance||0,                                   fmt:num},
  {l:"Vistas",             get:c=>c.vistas||0,                                    fmt:num},
  {l:"Retención (vistas/alcance)",get:c=>c.alcance?c.vistas/c.alcance:0,          fmt:v=>v.toFixed(2)+"×", tasa:true},
  {l:"Likes",              get:c=>c.likes||0,                                     fmt:num},
  {l:"Comentarios",        get:c=>c.comentarios||0,                               fmt:num},
  {l:"Guardados",          get:c=>c.guardados||0,                                 fmt:num},
  {l:"Compartidos",        get:c=>c.compartidos||0,                               fmt:num},
  {l:"Intención (guard+comp / alcance)",get:c=>c.alcance?((c.guardados||0)+(c.compartidos||0))/c.alcance:0,fmt:v=>(v*100).toFixed(2)+"%", tasa:true},
  {l:"Seguidores que trajo",get:c=>c.seguidoresGanados||0,                        fmt:v=>"+"+num(v)},
  {l:"Interesados (no compraron)",get:c=>interesados(c),                          fmt:v=>num(v)+""},
  {l:"Conversaciones totales",get:c=>conversaciones(c),                            fmt:v=>num(v)+""},
  {l:"Unidades vendidas",  get:c=>unidades(c),                                    fmt:v=>v+" u", clave:true},
  {l:"Cierre (vendidas / preguntaron)",get:c=>{const u=unidades(c),pp=c.posiblesClientes||0;return (u+pp)?u/(u+pp):0;},fmt:v=>(v*100).toFixed(0)+"%", clave:true, tasa:true},
  {l:"Conversión",         get:c=>c.alcance?unidades(c)/c.alcance:0,              fmt:v=>(v*100).toFixed(2)+"%", clave:true, tasa:true},
  {l:"Ingresos",           get:c=>ingresosItem(c),                                fmt:money},
  {l:"Ingreso por 1.000 de alcance",get:c=>c.alcance?ingresosItem(c)/c.alcance*1000:0,fmt:money, clave:true, tasa:true},
  {l:"Puntaje para pautar",get:c=>adsEval(c).score,                               fmt:v=>v+"/100", clave:true, tasa:true},
];

Views.comparar=()=>{
  const sel=comparar.map(id=>state.contenido.find(c=>c.id===id)).filter(Boolean);
  const grupos=gruposDeVersiones();

  const chips=[...state.contenido].sort((a,b)=>pd(b.fecha)-pd(a.fecha)).map(c=>{
    const on=comparar.includes(c.id), carp=CMAP[c.producto]||CMAP.general;
    return `<button class="btn sm" data-cmp="${c.id}" style="border-color:${on?"var(--accent)":"var(--border)"};background:${on?"var(--accent-soft)":"var(--surface)"};color:${on?"var(--accent-ink)":"var(--text)"}">
      <span style="width:7px;height:7px;border-radius:2px;background:${carp.color};display:inline-block"></span>
      ${esc(c.titulo)}</button>`;}).join("");

  let tabla="",conclusion="";
  if(sel.length>=2){
    const cab=sel.map(c=>{
      const ev=adsEval(c),st=ADS_ESTADOS[ev.estado]||ADS_ESTADOS.no,carp=CMAP[c.producto]||CMAP.general;
      return `<th style="min-width:180px;text-align:left;padding:14px 16px;vertical-align:top">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <b style="font-size:13.5px;color:var(--text)">${esc(c.titulo)}</b>
          ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:var(--accent-ink);display:inline-flex">${icon("play",14)}</a>`:""}
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">
          <span class="chip" style="background:color-mix(in srgb,${carp.color} 14%,transparent);color:${carp.color}">${carp.nombre}</span>
          ${tipoChips(c.tipos)}
        </div>
        <div class="muted" style="font-weight:500;font-size:11px;margin-top:6px;text-transform:none;letter-spacing:0">
          ${fdatel(c.fecha)} · ${TIPOS[c.tipo]} · ${c.canal==="anuncio"?"Anuncio":"Orgánico"}<br>
          ${c.framework&&FRAMEWORKS[c.framework]?FRAMEWORKS[c.framework].t:"Framework sin definir"}
        </div>
        <span class="chip" style="background:${st.bg};color:${st.c};margin-top:7px">${st.t}</span>
      </th>`;}).join("");

    const conf=sel.map(esConfiable);
    const filas=METRICAS_CMP.map(m=>{
      // una tasa sobre poco alcance no se compara: se muestra s/d y no compite por ganar
      const vals=sel.map((c,i)=>(m.tasa&&!conf[i])?null:m.get(c));
      const validos=vals.filter(v=>v!==null);
      const max=validos.length?Math.max(...validos):0;
      const hayDif=max>0&&validos.some(v=>v!==max);
      return `<tr>
        <td style="font-weight:600;font-size:12.5px;${m.clave?"color:var(--text)":"color:var(--muted)"}">${m.l}${m.clave?' <span class="chip" style="background:var(--accent-soft);color:var(--accent-ink);font-size:9.5px">clave</span>':""}</td>
        ${vals.map(v=>{
          if(v===null)return `<td class="muted" style="font-size:12px" title="Alcance insuficiente para leer esta tasa">s/d</td>`;
          const gana=max>0&&v===max&&hayDif;
          const dif=(max>0&&v!==max)?` <small class="muted">(${Math.round((v-max)/max*100)}%)</small>`:"";
          return `<td class="tnum" style="font-weight:${gana?"800":"600"};color:${gana?"var(--good)":"var(--text)"}">${m.fmt(v)}${gana?" ▲":dif}</td>`;
        }).join("")}
      </tr>`;}).join("");

    const aviso=conf.includes(false)?`<div class="card pad" style="margin-bottom:12px;background:var(--warn-soft);border-color:var(--warn)">
      <div style="font-size:12.5px;color:var(--warn)"><b>Ojo:</b> ${sel.filter((c,i)=>!conf[i]).map(c=>esc(c.titulo)).join(", ")} no llega${sel.filter((c,i)=>!conf[i]).length>1?"n":""} al alcance mínimo (${num(alcanceMinimo())}). Sus tasas salen s/d porque con tan poca gente cualquier porcentaje es ruido — los números absolutos sí se muestran.</div>
    </div>`:"";
    tabla=aviso+`<div class="tablecard"><div class="wrap"><table class="dt cmp">
      <thead><tr><th style="min-width:190px">Métrica</th>${cab}</tr></thead>
      <tbody>${filas}</tbody></table></div></div>`;

    // la lectura separa "ganó en alcance" de "ganó vendiendo", que es lo que confunde
    const porAlcance=[...sel].sort((a,b)=>(b.alcance||0)-(a.alcance||0))[0];
    const porConv=[...sel].sort((a,b)=>{
      const ca=a.alcance?unidades(a)/a.alcance:0, cb=b.alcance?unidades(b)/b.alcance:0;return cb-ca;})[0];
    const porScore=[...sel].sort((a,b)=>adsEval(b).score-adsEval(a).score)[0];
    let txt;
    if(!sel.some(c=>unidades(c)>0)){
      txt=`Ninguna vendió todavía, así que esto compara alcance y señales. <b>${esc(porAlcance.titulo)}</b> llegó a más gente. Ojo: más alcance no significa que venda mejor — eso recién se sabe cuando alguna registre ventas.`;
    }else if(porAlcance.id!==porConv.id){
      txt=`Acá está lo interesante: <b>${esc(porAlcance.titulo)}</b> ganó en alcance, pero <b>${esc(porConv.titulo)}</b> convierte mejor por persona alcanzada. Para pautar conviene la segunda — el alcance se compra, la conversión no.`;
    }else{
      txt=`<b>${esc(porConv.titulo)}</b> gana en alcance y en conversión a la vez. Es la versión a repetir y la candidata natural para pautar.`;
    }
    conclusion=`<div class="card pad" style="margin-top:16px;border-left:3px solid var(--accent)">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center">${icon("metricas",17)}</div>
        <div><b style="font-size:13.5px">Lectura</b>
          <div class="muted" style="font-size:12.5px;line-height:1.55;margin-top:4px">${txt}</div>
          <div class="muted" style="font-size:11.5px;margin-top:7px">Mejor puntaje para pautar: <b style="color:var(--text)">${esc(porScore.titulo)}</b> (${adsEval(porScore).score}/100)</div>
        </div>
      </div></div>`;
  }

  return `
  <div class="section-h">
    <div><div class="eyebrow">Versiones y variantes</div><h2 style="font-size:19px">Comparar piezas</h2></div>
    <span class="sp"></span>
    ${comparar.length?`<button class="btn sm" data-action="limpiarCmp">Limpiar</button>`:""}
  </div>

  ${grupos.length?`<div class="card pad" style="margin-bottom:16px">
    <div class="eyebrow" style="margin-bottom:10px">Versiones detectadas</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${grupos.map((g,i)=>`<button class="btn sm pri" data-grupo="${i}">${esc(g.arr[0].titulo.replace(/\s*[-–·|]?\s*(versi[oó]n|version|v)\s*\.?\s*\d+\s*$/i,""))} · ${g.arr.length} versiones</button>`).join("")}
    </div>
    <div class="muted" style="font-size:11.5px;margin-top:9px">Las detecta por el título. Un click y las compara todas.</div>
  </div>`:""}

  <div class="card pad" style="margin-bottom:16px">
    <div class="eyebrow" style="margin-bottom:10px">Elegí 2 a 4 piezas ${comparar.length?`· <span style="color:var(--accent-ink)">${comparar.length} seleccionada${comparar.length!==1?"s":""}</span>`:""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${chips||`<span class="muted" style="font-size:12.5px">Todavía no hay contenido cargado.</span>`}</div>
  </div>

  ${sel.length>=2?tabla+conclusion
    :`<div class="card"><div class="empty">${icon("metricas",30)}<div>Elegí al menos 2 piezas para compararlas.</div></div></div>`}`;
};

/* ============================================================
   CALENDARIO Y TUBERÍA
   Los estados y las fechas ya estaban guardados desde el principio;
   lo único que faltaba era mirarlos. Tres lecturas del mismo dato:
   cuándo sale cada cosa, en qué etapa está, y si estás cargando de
   más un producto sin darte cuenta.
   ============================================================ */
let calMes=new Date(HOY.getFullYear(),HOY.getMonth(),1);
let calVista="mes";   // mes | tablero

function mismoDia(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

/** Chip de una pieza dentro de una celda del calendario. */
function calChip(c){
  const carp=CMAP[c.producto]||CMAP.general;
  const pub=c.estado==="publicado";
  return `<button data-open="${c.id}" title="${esc(c.titulo)} · ${ESTADOS[c.estado].t}"
    style="display:flex;align-items:center;gap:5px;width:100%;text-align:left;border:none;cursor:pointer;
    background:${pub?`color-mix(in srgb,${carp.color} 16%,transparent)`:"var(--surface-2)"};
    border-left:2px solid ${carp.color};border-radius:5px;padding:3px 5px;margin-bottom:3px;
    font-size:10.5px;font-weight:600;color:var(--text);overflow:hidden">
    <span style="width:5px;height:5px;border-radius:50%;flex:none;background:${pub?"var(--good)":ESTADOS[c.estado].c}"></span>
    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.titulo)}</span>
  </button>`;
}

function calendarioMes(){
  const y=calMes.getFullYear(), m=calMes.getMonth();
  const primero=new Date(y,m,1); primero.setHours(12,0,0,0);
  const arranque=weekStart(primero);                  // la grilla empieza el lunes
  const celdas=[];
  for(let i=0;i<42;i++){
    const dia=addDays(arranque,i);
    const iso=fmtISO(dia);
    const piezas=state.contenido.filter(c=>c.fecha===iso);
    const delMes=dia.getMonth()===m;
    const hoy=mismoDia(dia,HOY);
    celdas.push(`<div style="min-height:92px;padding:6px;border-right:1px solid var(--border-2);border-bottom:1px solid var(--border-2);
      background:${hoy?"var(--accent-soft)":delMes?"var(--surface)":"var(--surface-2)"};opacity:${delMes?1:.5}">
      <div class="tnum" style="font-size:11px;font-weight:${hoy?"800":"600"};color:${hoy?"var(--accent-ink)":"var(--muted-2)"};margin-bottom:4px">${dia.getDate()}</div>
      ${piezas.map(calChip).join("")}
    </div>`);
    if(i>=34 && dia.getMonth()!==m && weekStart(dia).getMonth()!==m) break;
  }
  const dias=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  return `<div class="tablecard" style="overflow:hidden">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2)">
      ${dias.map(d=>`<div style="padding:9px 6px;font-size:10.5px;font-weight:700;color:var(--muted-2);text-align:center;letter-spacing:.06em">${d}</div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">${celdas.join("")}</div>
  </div>`;
}

function calendarioTablero(){
  const cols=Object.entries(ESTADOS).map(([k,v])=>{
    const arr=state.contenido.filter(c=>c.estado===k).sort((a,b)=>pd(a.fecha)-pd(b.fecha));
    return `<div class="tablero-col${arr.length?"":" vacia"}">
      <div style="display:flex;align-items:center;gap:7px;padding:0 2px 9px">
        <span style="width:8px;height:8px;border-radius:2px;background:${v.c}"></span>
        <b style="font-size:12.5px">${v.t}</b>
        <span class="chip" style="background:var(--surface-3);color:var(--muted)">${arr.length}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px">
        ${arr.map(c=>{const carp=CMAP[c.producto]||CMAP.general;
          return `<button class="card" data-open="${c.id}" style="text-align:left;cursor:pointer;padding:11px 12px;border-left:3px solid ${carp.color}">
            <b style="font-size:12.5px;display:block;line-height:1.35">${esc(c.titulo)}</b>
            <div class="muted" style="font-size:11px;margin-top:4px">${fdate(c.fecha)} · ${carp.nombre}</div>
            ${c.estado==="publicado"&&c.metricasCargadas?`<div style="margin-top:6px">${diagChip(c)}</div>`:""}
          </button>`;}).join("")
          ||`<div class="muted" style="font-size:11.5px;padding:10px 2px">Vacío</div>`}
      </div>
    </div>`;}).join("");
  return `<div class="tablero">${cols}</div>`;
}

/** Balance: si un producto o un tipo de reel se está comiendo el calendario. */
function calBalance(){
  const y=calMes.getFullYear(), m=calMes.getMonth();
  const delMes=state.contenido.filter(c=>{const d=pd(c.fecha);return d.getFullYear()===y&&d.getMonth()===m;});
  if(!delMes.length) return "";
  const porCarpeta=CARPETAS.map(k=>({...k,n:delMes.filter(c=>(c.producto||"general")===k.id).length})).filter(x=>x.n);
  const porTipo=Object.entries(TIPOS_REEL).map(([k,v])=>({...v,k,n:delMes.filter(c=>(c.tipos||[]).includes(k)).length})).filter(x=>x.n);
  const max=Math.max(...porCarpeta.map(x=>x.n));
  const dominante=porCarpeta.find(x=>x.n===max);
  const concentrado=delMes.length>=4 && max/delMes.length>0.6;
  const conVenta=delMes.filter(c=>(c.tipos||[]).includes("venta")).length;
  const pocaVenta=delMes.length>=4 && conVenta/delMes.length<0.34;

  const barra=(arr,total)=>`<div style="display:flex;height:8px;border-radius:20px;overflow:hidden;background:var(--surface-3)">
    ${arr.map(x=>`<div title="${x.nombre||x.t}: ${x.n}" style="width:${x.n/total*100}%;background:${x.color||x.c}"></div>`).join("")}
  </div>`;

  return `<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
    <div class="card pad">
      <div class="eyebrow" style="margin-bottom:9px">Reparto por producto · ${MESL[m]}</div>
      ${barra(porCarpeta,delMes.length)}
      <div class="legend" style="margin-top:11px">${porCarpeta.map(x=>`<span><i style="background:${x.color}"></i>${x.nombre} <b>${x.n}</b></span>`).join("")}</div>
      ${concentrado?`<div class="muted" style="font-size:11.5px;margin-top:10px;color:var(--warn)">
        ${dominante.nombre} se lleva ${Math.round(max/delMes.length*100)}% del mes. Cada superficie de la casa es un sub-avatar distinto: concentrarte en una deja las otras sin cubrir.</div>`:""}
    </div>
    <div class="card pad">
      <div class="eyebrow" style="margin-bottom:9px">Reparto por tipo de reel</div>
      ${porTipo.length?barra(porTipo,porTipo.reduce((a,x)=>a+x.n,0)):`<div class="muted" style="font-size:12px">Sin tipos marcados este mes.</div>`}
      ${porTipo.length?`<div class="legend" style="margin-top:11px">${porTipo.map(x=>`<span><i style="background:${x.c}"></i>${x.t} <b>${x.n}</b></span>`).join("")}</div>`:""}
      ${pocaVenta?`<div class="muted" style="font-size:11.5px;margin-top:10px;color:var(--warn)">
        Solo ${conVenta} de ${delMes.length} piezas tienen estructura de venta. El resto trae gente, no compradores.</div>`:""}
    </div>
  </div>`;
}

Views.calendario=()=>{
  const y=calMes.getFullYear(), m=calMes.getMonth();
  const delMes=state.contenido.filter(c=>{const d=pd(c.fecha);return d.getFullYear()===y&&d.getMonth()===m;});
  return `
  <div class="section-h">
    <div><div class="eyebrow">Planificación</div><h2 style="font-size:19px">Calendario</h2></div>
    <span class="sp"></span>
    <div class="seg">
      <button data-cal="mes" class="${calVista==="mes"?"on":""}">Mes</button>
      <button data-cal="tablero" class="${calVista==="tablero"?"on":""}">Tablero</button>
    </div>
    <button class="btn sm pri" data-action="newContenido">+ Nueva pieza</button>
  </div>

  ${calVista==="mes"?`
  <div class="section-h" style="margin-bottom:12px">
    <button class="iconbtn" data-cal-nav="-1" title="Mes anterior">‹</button>
    <b style="font-size:15px;min-width:150px">${MESL[m]} ${y}</b>
    <button class="iconbtn" data-cal-nav="1" title="Mes siguiente">›</button>
    <button class="btn sm" data-cal-nav="0">Hoy</button>
    <span class="sp"></span>
    <span class="muted" style="font-size:12px">${delMes.length} pieza${delMes.length!==1?"s":""} este mes</span>
  </div>
  ${calendarioMes()}
  ${calBalance()}
  `:`
  <div class="muted" style="font-size:12.5px;margin-bottom:14px">Cada pieza en la etapa donde está. Tocá una para abrirla.</div>
  ${calendarioTablero()}
  `}`;
};

/* ============================================================
   LA GUÍA — el manual de la cuenta, editable, con archivos.
   El contenido base se siembra la primera vez que la tabla está
   vacía y después vive en Supabase; lo que se edita acá queda.
