const GUIA_CAPITULOS=[{"id": "empezar", "nombre": "Empezar acá", "icono": "⚑", "desc": "Las reglas que mandan sobre todo lo demás. Si leés un solo capítulo, es este."}, {"id": "estrategia", "nombre": "Estrategia", "icono": "◎", "desc": "Los 4 pilares, la mezcla, las fases y las superficies como sub-avatares."}, {"id": "ganchos", "nombre": "Ganchos", "icono": "⚡", "desc": "Los 7 principios, los 13 tipos, los anti-patrones y cómo calificar uno."}, {"id": "guiones", "nombre": "Guiones", "icono": "✎", "desc": "Los 5 frameworks con tiempos, los 7 errores, los claims prohibidos y el checklist."}, {"id": "video", "nombre": "Cómo se arma un video", "icono": "▶", "desc": "Los bloques, los formatos héroe, la retención y qué grabar."}, {"id": "cta", "nombre": "CTAs y captions", "icono": "✉", "desc": "Un solo CTA, la ventana de 125 caracteres y los 6 bloques del caption."}, {"id": "carruseles", "nombre": "Carruseles", "icono": "▤", "desc": "La portada, el rehook, el cuerpo y el slide de guardado."}, {"id": "historias", "nombre": "Historias", "icono": "◔", "desc": "La mezcla 40/30/20/10, la espera como activo y las reglas de naturalidad."}, {"id": "dm", "nombre": "Cuando alguien contesta", "icono": "💬", "desc": "Del mensaje a la venta: qué decir, cuándo, y qué contestar a cada objeción."}, {"id": "competencia", "nombre": "Competencia", "icono": "◉", "desc": "Cómo se analiza un competidor, qué robarle a Purewall y dónde guardar referencias."}, {"id": "ia", "nombre": "IA: dónde sí, dónde no", "icono": "✦", "desc": "La regla de la prueba real, y todo lo que la IA sí puede hacer sin romperla."}, {"id": "biblioteca", "nombre": "Biblioteca", "icono": "▣", "desc": "Fotos, videos, anuncios y referencias subidas. Con una nota de qué se roba de cada una."}];
const GUIA_BASE=[{"id": "g_empezar_01", "capitulo": "empezar", "orden": 1, "titulo": "Para qué sirve esta guía", "contenido": "Esta guía existe para que **cualquiera pueda producir contenido de Purexis con el mismo criterio**, sin que haya que explicarlo de nuevo cada vez. Sirve si te olvidaste algo, si le pasás la grabación a otra persona, o si en seis meses querés saber por qué se decidió algo.\n\nTodo lo que dice acá está **validado en esta cuenta** o en el sistema del que sale. No es teoría de internet.\n\n**Cómo usarla:**\n- Si vas a escribir un guion, leé *Empezar acá* y después *Guiones*.\n- Si vas a grabar, leé *Cómo se arma un video*.\n- Si alguien te escribió por un reel, andá a *Cuando alguien contesta*.\n- Si querés subir una referencia (un video de la competencia, una foto, un anuncio), va en *Biblioteca* o adjunta al capítulo que corresponda.\n\nCada artículo se puede editar. Si aprendés algo nuevo, escribilo acá. Una regla que queda en la cabeza de una persona no es una regla."}, {"id": "g_empezar_02", "capitulo": "empezar", "orden": 2, "titulo": "Las reglas que mandan sobre todo lo demás", "contenido": "Estas van por encima de cualquier otra cosa que diga esta guía. Si un guion, un caption o una historia rompe una de estas, no sale.\n\n## 1 · La prueba nunca es IA\nNinguna pieza se produce con IA ni con render. **Ni una.** El diferencial completo de Purexis se apoya en que la prueba sea real: mano real, casa real, tiempo real. A la competencia le escriben debajo de cada post *\"me da cosa porque todos los videos están hechos con IA\"*. Ese es el hueco que ocupamos. Una sola pieza generada lo tira abajo, y además Instagram la etiqueta en público.\n\n## 2 · Coherencia interna\nUn guion no puede decir que algo funciona y después que no funciona. Ni entre bloques, ni entre el guion y el caption, ni entre el guion y el texto en pantalla. Cuando se ataca un truco casero, **una sola postura sostenida**: *\"Todas te sacan la mancha. Ninguna evita que vuelva.\"* El truco hace una cosa y no hace la otra. Eso no es contradicción, es precisión.\n\n## 3 · Un guion, un eje, un producto\nSi el video muestra sarro, el guion habla de sarro. Si hay dos ideas centrales, son dos videos. **Una superficie por reel**: cada *\"¿sirve para X?\"* es una persona distinta.\n\n## 4 · Un solo CTA\nDos CTAs equivalen a ninguno. Y **\"seguime para más\" no vende**: sirve para crecer, nunca como cierre por defecto de una pieza de venta.\n\n## 5 · Ningún claim sin validar\nSi un dato no se puede verificar, no entra. Un dato falso en un rubro donde nadie confía es peor que no tener dato. La lista de claims prohibidos está en *Guiones*.\n\n## 6 · Tono de persona, no de marca\n*\"Esta es la mejor solución que encontré\"*, no *\"nuestro producto elimina\"*. La voz es la de alguien que encontró la solución, no la de una empresa.\n\n## 7 · Nunca guion largo\nEl guion largo (—) delata IA. Punto, coma o salto de línea.\n\n## 8 · Voseo argentino\nNunca \"tú\". El mercado es Argentina.\n\n## 9 · Ningún CTA apunta a algo que no existe\nSi el CTA dice \"te mando el descuento\", el descuento existe y hay quien lo mande.\n\n## 10 · Ante la duda, preguntar\nAntes que inventar."}, {"id": "g_empezar_03", "capitulo": "empezar", "orden": 3, "titulo": "El test de los 30 segundos antes de publicar", "contenido": "Antes de que salga cualquier pieza, cinco preguntas. Si alguna da mal, no sale.\n\n1. **¿Se ve la mano y la casa?** Si podría ser un render o un packshot, no es Purexis.\n2. **¿Hay un dato que el que mira no sabía?** Si el guion solo describe lo que se ve, es una locución, no un guion.\n3. **¿Un solo tema, una sola superficie, un solo CTA?**\n4. **¿Hay algún claim que hoy no puedo probar?** Si lo hay, se cambia por *prometer la prueba*: *\"en una semana te lo muestro otra vez\"*.\n5. **¿Esto lo podría haber hecho cualquier otra marca de limpieza si le saco el logo?** Si sí, se rehace."}, {"id": "g_estrategia_01", "capitulo": "estrategia", "orden": 1, "titulo": "Los 4 pilares y su proporción", "contenido": "Toda pieza de Purexis pertenece a uno de estos cuatro pilares. La proporción no es decorativa: es lo que hace que la cuenta venda en vez de solo crecer.\n\n| Pilar | Qué hace | Proporción | La métrica que lo juzga |\n|---|---|---|---|\n| **PRUEBA** | una toma continua, mano real, sin IA. Es el diferencial de la marca | **40%** | guardados y comentarios de \"¿dónde lo compro?\" |\n| **IMÁN** | satisfacción visual, antes/después brutal, ASMR | **30%** | compartidos |\n| **FILTRO** | postura dura sobre el rubro. Repele al que no sirve, une al que sí | **20%** | comentarios |\n| **OFERTA** | precio, dónde se compra, cuánto tarda, qué incluye | **10%** | clics al link y ventas |\n\n**Por qué PRUEBA es el más grande y no IMÁN:** el imán trae vistas, pero en esta categoría la venta no se pierde por falta de alcance, se pierde por **desconfianza**. Purewall tiene el alcance y aun así le escriben que sus videos parecen IA. La prueba es lo que convierte, y además nadie la está haciendo.\n\nSi un mes el pilar OFERTA se comió el 40%, ese mes se rompió el sistema. El calendario del panel te avisa cuando un producto o un tipo de pieza se está llevando el mes."}, {"id": "g_estrategia_02", "capitulo": "estrategia", "orden": 2, "titulo": "Los 3 formatos héroe", "contenido": "Tres formatos que se alternan. Todo lo demás es refuerzo.\n\n## A · La toma única\nPlano fijo, sin corte, del producto actuando. Trípode o teléfono apoyado. Se ve la mano, se ve la casa, se ve el reloj o la fecha.\n\n**Estructura:** gancho hablado de 3 segundos → aplicación en vivo → espera comprimida con la cámara fija y el cronómetro en pantalla → paño → resultado → CTA.\n\n**Por qué funciona:** es la respuesta directa a la objeción más cara de la categoría: *\"¿es real?\"*.\n\n## B · ¿Sirve para X?\nUna pregunta real, una superficie, 20 segundos.\n\n**Estructura:** repetir la pregunta textual (con el comentario en pantalla si es real) → aplicar → mostrar → decir también **dónde no funciona**.\n\n**Por qué funciona:** siete personas se lo preguntaron a la competencia y nadie les contestó en contenido. Cero creatividad necesaria, alto volumen, y cada uno captura una búsqueda distinta.\n\n## C · A vs B\nCámara fija, misma superficie partida al medio. Un lado el método viejo (lavandina, vinagre), el otro el producto. Mismo tiempo, mismo paño.\n\n**Estructura:** mostrar la división → aplicar los dos → esperar → comparar → nombrar el concepto.\n\n**Por qué funciona:** es prueba y filtro a la vez, y genera discusión sin insultar a nadie.\n\n**De refuerzo, sueltos:** Error común · Q&A de precio · Novedad personal (el envío) · Escenario."}, {"id": "g_estrategia_03", "capitulo": "estrategia", "orden": 3, "titulo": "Cada superficie es una persona distinta", "contenido": "La idea que ordena todo el contenido: cada *\"¿sirve para X?\"* de los comentarios **no es una duda técnica. Es una persona distinta, con una escena distinta y un miedo distinto**, que se identifica solo si el reel nombra su superficie.\n\nUn video que dice *\"para el hogar\"* no le habla a nadie. Uno que dice *\"si tenés el techo del baño manchado y no querés subirte a una silla\"* le habla a una persona. Y la de las cortinas igual se identifica cuando le toque su video.\n\n**Diez superficies = diez reels = diez búsquedas distintas capturadas.**\n\nLas que ya están mapeadas, con su verdad técnica y su descalificador, están en `02-estrategia/mapa-de-superficies.md`. Las dos más fuertes:\n\n## Juntas del baño (el centro)\nLa junta es cemento poroso. El moho mete hifas dentro del poro, no se apoya arriba. Refregar arranca la superficie y deja el núcleo: por eso vuelve a los quince días. **Descalificador:** si la junta está rota o hundida, esto no la reconstruye.\n\n## Mampara y vidrios (el hallazgo más fuerte)\nLo blanco de la mampara no es una suciedad, son dos: una capa grasosa de jabón arriba y una capa mineral de sarro abajo. Los limpiadores comunes sacan solo la orgánica. Por eso *\"le paso de todo y no sale\"* es literal: le está pasando el producto correcto a la capa equivocada. **Orden de uso:** primero desengrasar, después el ácido. **Descalificador:** si el vidrio ya está grabado por años de cal, ningún producto lo devuelve.\n\n**Esto explica el peor comentario que tiene la competencia** (*\"no sacó nada, fue como aplicar agua\"*): aplicó sobre la capa de jabón. Explicarlo en un video previene la peor reseña posible y nos posiciona como los que saben."}, {"id": "g_estrategia_04", "capitulo": "estrategia", "orden": 4, "titulo": "El plan por fases y el ritmo", "contenido": "## Fase 0 · Cerrar la brecha (videos 1 a 25)\nProducir con los formatos héroe sin esperar a que nada explote. Acá se aprende a grabar, no a viralizar.\n\n## Fase 1 · Análisis (cada 2 a 4 semanas)\nQué funcionó y qué no. El panel hace el diagnóstico pieza por pieza y te dice dónde se cae el contenido en general (en el gancho, en el medio, en los envíos o en la venta).\n\n## Fase 2 · Experimentación (tandas de 10)\nSe prueba una variable por tanda. No cinco. Si cambiás gancho y formato a la vez, no sabés cuál movió la aguja.\n\n## Fase 3 · Triplicar\nLo que funcionó se reversiona: misma estructura, otra superficie u otro producto. El comparador del panel agrupa las versiones solo.\n\n## La mezcla 3/1/1\nPor cada cinco piezas: tres de los formatos héroe, una de refuerzo, una de oferta o serie.\n\n## Batching\nSe graba de a lotes. Un día de grabación rinde para dos o tres semanas de piezas si se planifica: mismo baño, misma luz, varias superficies. Grabar de a una es la forma más cara de hacerlo."}, {"id": "g_ganchos_01", "capitulo": "ganchos", "orden": 1, "titulo": "Los 7 principios de un gancho", "contenido": "El gancho es el metro cuadrado más caro del video. La decisión de quedarse o seguir scrolleando se toma en **1,7 segundos**.\n\n**1 · Contexto rápido.** De qué trata queda claro en la primera oración. Nadie se queda para un valor que no sabe que viene.\n\n**2 · Claridad.** Cero ambigüedad. Si se puede entender de dos maneras, se reescribe. Que el espectador no entienda las palabras es el asesino silencioso número uno.\n\n**3 · Contraste.** La distancia entre lo que el que mira cree hoy y lo que le estás proponiendo. Cuanto más grande la brecha en un tema que le importa, más enganchado queda. *\"Todas te sacan la mancha. Ninguna evita que vuelva.\"*\n\n**4 · Destilación.** La menor cantidad de palabras posible. Si podés sacar una sin perder claridad, sacala.\n\n**5 · Especificidad.** Números, objetos, plazos. *\"3 años de sarro\"* gana a *\"mucho sarro\"*. *\"10 segundos\"* gana a *\"rápido\"*.\n\n**6 · Velocidad de absorción.** Se procesa a velocidad de habla, sin perderse. En el feed no existe el rebobinar. Lenguaje llano primero.\n\n**7 · Promesa de valor inmediata.** El gancho contiene lo que se lleva, no lo insinúa. Si hay que ver 5 segundos más para entender de qué va, está roto.\n\n**Bonus · Ancla de credibilidad.** Una prueba en las líneas 2 o 3: un resultado, un dato. No es obligatoria. Cuando está y suena natural, rinde más."}, {"id": "g_ganchos_02", "capitulo": "ganchos", "orden": 2, "titulo": "Los anti-patrones: lo que se marca siempre", "contenido": "| Anti-patrón | Ejemplo | Por qué falla |\n|---|---|---|\n| Guion largo (—) | *\"El sarro — ese enemigo silencioso —\"* | delata IA |\n| Superlativo sin dato | *\"lo más potente\"*, *\"el mejor truco\"*, *\"te va a volar la cabeza\"* | sirve para cualquier producto, no hace trabajo específico, y en esta categoría activa la sospecha de estafa |\n| Contexto demorado | el tema recién se entiende en la oración 2 o 3 | todo lo anterior hace rebotar |\n| Carraspeo inicial | *\"Bueno,\"*, *\"Hoy les traigo\"*, *\"En este video\"*, *\"¿Sabías que…\"* | gasta el renglón más caro en nada |\n| Varios puntos inconexos | tres ideas apretadas en el gancho | una promesa clara o ninguna |\n| Jerga en frío | términos técnicos antes de preparar al espectador | pérdida de comprensión |\n| Remate de miedo genérico | *\"y si no hacés esto, vas a fracasar\"* | no hace trabajo específico |\n| Gancho genérico | *\"¿Cansado de limpiar y que vuelva?\"* | no nombra una escena |\n\n**Lo que va en lugar del genérico:** *\"Si limpiás el moho del baño y vuelve en dos semanas, esto es para vos.\"* Nombra la superficie, el plazo y la frustración exacta."}, {"id": "g_ganchos_03", "capitulo": "ganchos", "orden": 3, "titulo": "Los 13 tipos de gancho", "contenido": "| Tipo | Qué hace | En Purexis |\n|---|---|---|\n| **Problema** | identifica un problema y ofrece el truco | el de cabecera |\n| **Contrarian** | se opone a la creencia popular, rompe el mito | *\"Blanco no siempre significa resuelto\"* (lo usa Purewall, ojo) |\n| **Comparación** | A vs B, antes vs después, viejo vs nuevo | formato héroe C |\n| **Pregunta** | una en la que el espectador ya está atascado | formato héroe B |\n| **Autoridad** | resultados, antes/después, casos | la toma única |\n| **Experiencia personal** | primera persona | *\"yo probé cinco y este me duró\"* |\n| **Revelación** | algo antes desconocido | el dato no obvio |\n| **Negativo** | advierte contra algo y sugiere alternativa | *\"pará de usar esponja de acero\"* |\n| **Lista** | opciones numeradas | \"3 razones\" |\n| **Educativo** | enseña una habilidad | por qué vuelve el moho |\n| **Escenario** | plantea una hipótesis | *\"si tu extractor no anda…\"* |\n| **Ranking** | ordena ítems | poco en Purexis |\n| **Caso** | logro de un tercero | testimonios |\n\nLos que más rinden en producto físico: **Problema, Comparación, Pregunta y Autoridad.** El que mira ya sabe que tiene el problema; no hay que convencerlo de que le pasa, hay que demostrarle que entendemos por qué."}, {"id": "g_ganchos_04", "capitulo": "ganchos", "orden": 4, "titulo": "Ganchos de Purexis, por framework", "contenido": "Variantes ya escritas para arrancar. Se adaptan a la superficie del video.\n\n## Para PAS (problema · agitación · solución)\n- *\"Si todavía estás usando vinagre para el sarro, mirá esto.\"*\n- *\"La razón por la que el moho vuelve no es lo que pensás.\"*\n- *\"Pará de usar esponja de acero antes de hacer esto.\"*\n\n## Para Antes / Después\n- *\"Yo antes pasaba veinticinco minutos de rodillas cada sábado. Esto es lo que cambió.\"*\n- *\"Tres años de sarro. Una pasada.\"*\n\n## Para 3 razones\n- *\"Hay tres razones por las que el vinagre no te saca el sarro, y la tercera es la que nadie te dice.\"*\n\n## Para desmitificar trucos\n- *\"El vinagre sí saca el sarro. Pero necesita toda la noche, no cinco minutos.\"*\n- *\"Bicarbonato y vinagre juntos se neutralizan. No limpian nada.\"*\n\n## Para la pregunta real (¿sirve para X?)\n- *\"Me preguntaron si sirve para el techo del baño. Lo probé sin escalera.\"*\n\n## Cómo se califica un gancho propio\nContra los 7 principios, con nota de A+ a F. **Un gancho propio por debajo de B+ no se graba, se reescribe.** Cuando pedís reescrituras, pedí tres que ataquen cosas distintas: una arregla la estructura, otra reencuadra la promesa, otra suma un número. No tres variaciones del mismo arreglo."}, {"id": "g_guiones_01", "capitulo": "guiones", "orden": 1, "titulo": "Qué tiene que lograr cada guion", "contenido": "Cinco cosas, en orden:\n\n1. **Enganchar en los primeros 2 segundos** con un hook específico y doloroso.\n2. **Mostrar el problema de forma relatable**, que el que mira diga *\"eso me pasa a mí\"*.\n3. **Demostrar el producto trabajando.** Antes/después visible, espuma, transformación. La gente compra transformaciones, no fórmulas.\n4. **Educar sin abrumar.** Uno o dos datos clave, no un tutorial completo.\n5. **Cerrar con un CTA claro.**\n\n**Formato:** reels de 15 a 45 segundos. Sin habla a cámara. Voz en off mínima y opcional sobre imagen real. Sin música, y el resultado sin voz.\n\n**La regla que decide todo:** *un guion que describe lo que se ve no es un guion, es una locución.* El test antes de grabar: ¿hay una sola frase que el espectador no pudiera haber deducido mirando el video sin sonido? Si no la hay, el guion no existe todavía."}, {"id": "g_guiones_02", "capitulo": "guiones", "orden": 2, "titulo": "Los 5 frameworks, con tiempos", "contenido": "Se rotan. No se usa siempre el mismo.\n\n## 1 · PAS · Problema, Agitación, Solución\n**15 a 25 s · audiencia fría · el de Purexis por defecto**\n\n```\n0:00-0:02  HOOK      el problema con especificidad\n0:02-0:08  AGITAR    el costo de no resolverlo, con un dato, no con adjetivos\n0:08-0:20  RESOLVER  el producto trabajando y cómo funciona\n0:20-0:25  CTA       qué hacer exactamente\n```\n\n## 2 · Antes / Después\n**20 a 30 s · transformación visual dramática**\n\n```\n0:00-0:02  HOOK        el estado \"antes\" como escena vivida\n0:02-0:06  ANTES       qué significaba vivir con eso\n0:06-0:10  HALLAZGO    cómo apareció el producto\n0:10-0:25  DESPUÉS     con detalles medibles\n0:25-0:30  CTA\n```\n\n## 3 · 3 razones\n**25 a 35 s · cuando hace falta educar**\n\n```\n0:00-0:02  HOOK      una afirmación que las 3 razones van a probar\n0:02-0:08  RAZÓN 1   beneficio con mecanismo\n0:08-0:14  RAZÓN 2   beneficio + limitación de las alternativas\n0:14-0:22  RAZÓN 3   la más sorprendente. Siempre la más fuerte al final\n0:22-0:28  CTA\n```\n\n## 4 · Desmitificando trucos caseros\n**30 a 45 s · para posicionar por encima del DIY**\n\n```\n0:00-0:03  HOOK        afirmación contraintuitiva\n0:03-0:12  EL MITO     el truco popular y por qué la gente lo usa\n0:12-0:25  LA REALIDAD por qué falla. Ciencia simple, 1 o 2 razones\n0:25-0:35  SOLUCIÓN    el producto y por qué funciona donde el truco falla\n0:35-0:45  CTA         probar + pregunta de engagement\n```\n⚠️ **Es el framework donde se rompe la coherencia más fácil.** La postura tiene que ser una sola de principio a fin. No *\"el truco funciona / no funciona\"*: *\"en qué condición funciona y por qué esa condición no se cumple\"*.\n\n## 5 · Fundador / Origen\n**30 a 45 s · construye marca**\n\n```\n0:00-0:03  HOOK          el momento de frustración que inició todo\n0:03-0:10  PROBLEMA      por qué las soluciones existentes fallaron\n0:10-0:25  CONSTRUCCIÓN  la idea central y qué se hizo\n0:25-0:35  RESULTADO     primeros clientes, prueba social\n0:35-0:45  INVITACIÓN\n```\n🔴 **Solo con la historia real.** Una historia de origen inventada es la forma más rápida de perder una marca cuyo diferencial es la honestidad."}, {"id": "g_guiones_03", "capitulo": "guiones", "orden": 3, "titulo": "Los 6 componentes de un guion de 9", "contenido": "Un guion de 4 tiene los tres primeros. Uno de 9 tiene los seis.\n\n## 1 · El fracaso previo, con marcas y objetos\nNo *\"probaste de todo\"*. **Limón, vinagre, esponja de acero, pastilla azul, cepillo de dientes viejo.** El objeto concreto es lo que produce el *\"ese soy yo\"*.\n\n## 2 · Tono de persona, no de marca\n*\"Esta es la mejor solución que encontré\"*, no *\"nuestro producto elimina\"*.\n\n## 3 · Una instrucción con número\n*\"Diez segundos\"*. *\"Dejá actuar 15 minutos, cepillá, enjuagá.\"* El número le da al que mira un contenedor mental y hace el video citable. *\"15 minutos\"* suena más real que *\"un rato\"*.\n\n## 4 · Un dato no obvio y verificable ← el que suele faltar\nEl que convierte el video en información. Casi siempre responde **por qué el problema vuelve**. Ejemplos verificados:\n- El vinagre **sí** disuelve el sarro, pero necesita **toda la noche**, no cinco minutos.\n- La esponja de acero **raya el cromo** y en cada microfisura el sarro se agarra más rápido.\n- Lo blanco de la mampara son **dos capas**: jabón arriba, mineral abajo.\n- El bicarbonato y el vinagre **se neutralizan entre sí**.\n- El yeso **absorbe**: rociarlo lo degrada.\n\nDe dónde salen, por rendimiento: la química real del problema · por qué falla el remedio casero (en qué condición sí funciona) · qué empeora el problema · los comentarios de la competencia · la ficha técnica del producto.\n\n## 5 · Un contraste medible, no un adjetivo\n| Adjetivo ❌ | Contraste ✅ |\n|---|---|\n| \"solución mágica\" | \"toda la noche, o diez segundos\" |\n| \"resultados increíbles\" | \"tres años de sarro, una pasada\" |\n| \"el mejor producto\" | \"cambiar el inodoro sale X, esto sale Y\" |\n\nUn adjetivo le pide al que mira que crea. Un número lo deja calcular solo. Y lo que uno calcula, se lo cree.\n\n## 6 · Un remate repetible\nCinco palabras o menos, con un contraste adentro, al final y sin nada después. *\"Toda la noche, o diez segundos.\"* *\"Una pasada. Una.\"* *\"No es mugre. Es jabón.\"* Lo que se puede repetir es lo que se comparte."}, {"id": "g_guiones_04", "capitulo": "guiones", "orden": 4, "titulo": "Los 7 errores que descartan un guion", "contenido": "**1 · Hook genérico.** ❌ *\"¿Cansado de limpiar y que vuelva?\"* → ✅ *\"Si limpiás el moho del baño y vuelve en dos semanas, esto es para vos.\"*\n\n**2 · Explicar mucho, mostrar poco.** ❌ 40 s de voz en off → ✅ 10 s de explicación + 20 s de producto trabajando.\n\n**3 · CTA débil o ausente.** ❌ *\"Espero que les sirva\"* → ✅ *\"Comentá MOHO y te mando dónde conseguirlo\"*.\n\n**4 · Sin tiempos de acción.** ❌ *\"dejá actuar\"* → ✅ *\"dejá actuar 15 minutos, cepillá, enjuagá\"*.\n\n**5 · No diferenciarse de las alternativas.** ❌ *\"Purexis es el mejor\"* → ✅ *\"A diferencia del vinagre, que solo saca la superficie, esto penetra el poro\"*. El que mira ya probó otras cosas: si no decís por qué esto es distinto, asume que es lo mismo.\n\n**6 · Guion que no coincide con el producto del video.** Si el video muestra sarro y el guion habla de moho, el que mira asume que es contenido genérico hecho con IA.\n\n**7 · Contradicción interna.** Ver la regla de coherencia en *Empezar acá*.\n\n**Y los 4 que bajan la nota sin descartar:**\n- **La receta secuencial.** *\"Hacé esto, después esto.\"* Cada frase entrega lo que promete al instante: no hay razón para quedarse hasta el final. Un guion necesita algo que no se resuelva hasta el cierre.\n- **La voz que narra la imagen.** *\"Así queda el antes y el después.\"* Eso ya se está viendo. La voz aporta lo que la imagen no puede decir.\n- **El superlativo sin dato.**\n- **La promesa que no se puede probar hoy.** *\"Previene la reaparición.\"* Reemplazo: *\"En una semana te lo muestro otra vez, sin volver a limpiarlo.\"* Prometer la prueba en vez del resultado."}, {"id": "g_guiones_05", "capitulo": "guiones", "orden": 5, "titulo": "Claims que no se escriben sin validar", "contenido": "Varias afirmaciones que circulan en el rubro no se pueden usar hasta tener la ficha técnica del producto o filmarlo.\n\n| Claim | Estado | Qué hacer |\n|---|---|---|\n| *\"mata la raíz\"* | 🔴 doble problema | Purewall ya lo usa en 5 piezas, y es promesa no probable. Reemplazo: *\"la mancha está afuera, el hongo está adentro del poro\"* |\n| *\"la espuma se pone negra: es el hongo muriendo\"* | 🔴 sin verificar | si el producto no hace eso, es el reclamo *\"no sacó nada\"* servido en bandeja |\n| *\"espuma verde = sarro disolviéndose\"* | 🟡 depende del producto | el color lo define la formulación. Verificar y filmarlo |\n| *\"no vuelve por meses\"* | 🔴 promesa | reemplazo: *\"en un mes te muestro esta misma junta sin volver a limpiarla\"*. Prometé la prueba, no el resultado |\n| *\"convierte el óxido en capa protectora\"* | 🔴 sin verificar | eso es un convertidor de óxido. Si Purexis no lo es, es falso |\n| *\"penetra 10 veces más profundo\"* | 🔴 número inventado | un número falso en una marca que vende honestidad es peor que no tener número |\n| *\"certificado científicamente\"* | 🔴 claim regulado | solo con ensayo o registro, mostrándolo |\n| *\"sin olor fuerte\"* | 🟡 verificar | Purewall tiene comentarios públicos de *\"huele muy fuerte\"*. Si Purexis huele, esa promesa es el primer comentario negativo |\n\n## La espuma como prueba visual\nPara un ácido sobre **sarro u óxido es cierto**: la efervescencia es la reacción del ácido con el mineral. **Con agua oxigenada sobre moho es falso**: ahí la espuma la produce una enzima presente en cualquier materia orgánica, burbujea igual haya hongo o no.\n\n**Regla:** la espuma se usa como prueba en sarro y óxido. En moho, no."}, {"id": "g_guiones_06", "capitulo": "guiones", "orden": 6, "titulo": "Checklist: menos de 8 sobre 10 no se graba", "contenido": "| # | Criterio |\n|---|---|\n| 1 | Hook específico, no genérico, en los primeros 2 s |\n| 2 | Problema relatable: el que mira dice *\"eso me pasa\"* |\n| 3 | Muestra el producto trabajando, no solo habla |\n| 4 | Incluye tiempo de acción concreto |\n| 5 | Se diferencia de las alternativas por nombre |\n| 6 | CTA claro al final |\n| 7 | Duración adecuada al framework |\n| 8 | Coherente con el producto del video |\n| 9 | Tono conversacional, de persona |\n| 10 | Tiene elemento ASMR: espuma, spray, paño |\n| **11** | **Cero contradicción interna** ← eliminatorio |\n| **12** | **Ningún claim sin validar** ← eliminatorio |\n\nY de las reglas de copy: ¿hay un dato no obvio? ¿ese dato explica por qué le venía pasando a él? ¿está verificado? ¿hay un contraste con números? ¿nombré los objetos que ya probó? ¿hay un remate repetible al final?\n\n**Formato de entrega de un guion:** título (producto + framework) · duración · framework · guion con timestamps, texto narrado entre comillas y nota visual de qué se ve · una variante de hook para testear · el caption · advertencias de claim si las hay."}, {"id": "g_video_01", "capitulo": "video", "orden": 1, "titulo": "Los bloques de un reel que vende", "contenido": "Un reel de venta **no vende**. Si intenta vender, el espectador reconoce el pitch en dos segundos y se va. Hace una sola cosa: dejar al que mira con la sensación de que *entendemos su problema mejor que él*. Eso dispara la consulta.\n\n| | Reel de valor | Reel de venta |\n|---|---|---|\n| Arranca en | un problema | **una escena** que el avatar vivió |\n| Entrega | un consejo | un **reencuadre**: no es X, es Y |\n| Cierra con | el consejo aplicado | el **costo** de no resolverlo |\n| Deja al que mira | mejor informado | **descolocado** |\n\n**El reencuadre es la venta.** Si el avatar se diagnostica mal (*\"limpio mal\"*), va a seguir comprando la solución equivocada. Mostrarle que su diagnóstico está mal (*\"no limpiás mal, estás limpiando la superficie de algo que tiene raíz\"*) es, al mismo tiempo, mostrarle que nosotros tenemos el diagnóstico bueno.\n\n## Los 6 bloques\n```\n1 · GANCHO ESPECÍFICO   situación reconocible, no consejo genérico\n2 · DOLOR VISIBLE       qué le pasa, en escena\n3 · DOLOR PROFUNDO      qué está en juego (el sábado de rodillas, la visita que viene)\n4 · REENCUADRE          romper la creencia. No es X, es Y\n5 · SOLUCIÓN            el producto trabajando + el dato de por qué funciona\n6 · CTA                 uno, con palabra clave\n```\n\nEl dolor se parte en dos y los dos van **antes** del reencuadre. Sin esa secuencia el reencuadre llega antes de que le duela y se lee como un dato curioso.\n\n## Dar el 100%\nNo guardarse el 5% bueno. Si das el 95%, el que mira no sabe si lo que falta es justo lo que necesita. Dando todo le demostrás que tenés la respuesta. El que lo aplica solo igual lo habría resuelto; los compradores son los que entienden el qué y quieren el producto que lo hace."}, {"id": "g_video_02", "capitulo": "video", "orden": 2, "titulo": "Qué se graba: la toma y la casa", "contenido": "## Lo que tiene que verse\n- **La mano.** Real, de alguien. Sin guante blanco de laboratorio.\n- **La casa.** El baño con las cosas donde están. La casa perfecta rompe la identificación.\n- **El tiempo.** Cronómetro en pantalla o el reloj visible en la toma única. Es la prueba de que no hay corte.\n- **El paño.** Arrastrando. Es el momento ASMR y el momento de la verdad.\n- **El antes y el después en el mismo plano.** Sin cambio de ángulo entre uno y otro; si cambia el ángulo, se pierde la prueba.\n\n## Lo que no\n- Render, packshot, imagen generada. Nunca.\n- Aro de luz. Luz de la casa.\n- Música de stock encima de una prueba. Audio ambiente: el spray, el agua, el paño.\n- Habla a cámara. Voz en off mínima, o texto en pantalla.\n- Guante, uniforme, cartel de marca en cuadro. Cuanto más diseñada la pieza, menos creíble.\n\n## Lo que robamos de los que venden miles por día\n- **RMR-86** (20.000 unidades por semana): demostraciones puras en tiempo real. 3 a 10 segundos de transformación visible. Un problema por video. Prueba visual por encima de producción.\n- **CLR:** especificar tiempos (*\"dejar actuar 2 a 3 minutos\"*) y **frecuencia de uso** (*\"repetir cada mes en aguas duras\"*). Casi nadie lo hace y es lo que genera recompra.\n- **The Pink Stuff:** ASMR. El sonido del spray, la espuma expandiéndose, el paño.\n- **Concrobium:** la solución profesional al alcance del hogar. Educar sobre por qué falla la lavandina. Seguridad como argumento.\n\n## Batching: un día de grabación, tres semanas de piezas\nMismo baño, misma luz, varias superficies. Grabar el antes de todas, aplicar en todas, esperar una vez, grabar el después de todas. Después se editan como piezas separadas."}, {"id": "g_video_03", "capitulo": "video", "orden": 3, "titulo": "Retención: cómo se sostiene la atención después del gancho", "contenido": "El gancho consigue la atención. La retención la sostiene. Son trabajos distintos.\n\n## Estructura\n- **No reveles todo de entrada.** Lo que vino a buscar se muestra al final, o se empieza a hablar de eso después de los primeros 3 a 5 segundos.\n- **Que se noten las secciones.** Saber que hay un punto 2 y un punto 3 lo mantiene.\n- **Sacá el relleno.** Cada segundo sin función es un segundo donde alguien se va.\n- **Que se reproduzca más de una vez:** algo que obligue a pausar (un dato en pantalla), o armarlo en bucle, o cambiar el encuadre para introducir variación.\n\n## Video\n- Un corte cada 3 segundos como máximo, **salvo la toma única**, donde el plano continuo es la prueba.\n- **La iluminación es lo que más mueve la percepción de calidad.** Más que la cámara.\n\n## Texto en pantalla\n- Máximo **2 o 3 palabras** por vez. Color solo en la palabra clave.\n- Que el texto, el guion y el caption hablen del mismo tema: Instagram lee los tres para clasificar el video.\n\n## Sonido\n- Sin música en la prueba. Audio ambiente.\n- La frase que se comparte, **sin corte y sin música encima**.\n- Un micrófono externo es la inversión de mayor impacto si hay voz.\n\n## El polo de Purexis\nCuanto más basada en confianza la venta, más conviene el polo sobrio: cortes secos, cero adorno, subtítulos limpios, música baja o ausente. Los efectos llamativos construyen percepción de \"creador de contenido\"; acá restan.\n\n**Qué te dice el panel si esto falla:** si el gancho pasó y el tiempo medio de visualización cae por debajo del umbral, el diagnóstico dice *\"se cayó en el medio\"*. Ahí el problema es este capítulo, no el gancho."}, {"id": "g_video_04", "capitulo": "video", "orden": 4, "titulo": "Formatos: cuál usar según el material que tenés", "contenido": "Un guion se arma eligiendo un ladrillo de cada caja: **formato → estructura → tipo de gancho → gancho visual → CTA**. El error típico es saltear la estructura y escribir \"libre\".\n\n## Los que más usa Purexis\n| Formato | Arranca desde | Estructura |\n|---|---|---|\n| **Problema · Solución** | un problema del espectador | gancho → agitación del dolor → solución → implicación → CTA |\n| **Error común** | un error que repite | nombrar la trampa → agitación → por qué pasa → corrección → CTA |\n| **Tutorial** | un proceso | mostrar el resultado → objetivo → pasos, camino más corto → CTA |\n| **A vs B** | una comparación | marcar la comparación → criterios → desglose, empezar por lo no obvio → ganador → CTA |\n| **Q&A** | una pregunta real | la pregunta → por qué importa → respuesta → CTA |\n| **Lista** | opciones | prometer un número → entregar rápido → CTA |\n\n## Los de marca, de vez en cuando\n| Formato | Arranca desde | Estructura |\n|---|---|---|\n| **Novedad personal** | algo que pasó (el envío, el primer pedido) | la novedad → contexto → detalles con tensión → por qué → CTA |\n| **Fundador** | la historia de origen | quién sos → vida normal → momento de cambio → cómo cambió → CTA |\n| **Serie** | un episodio de algo más grande | misión del episodio → contexto → arco → resolución o gancho al siguiente |\n\n## Ganchos visuales que sirven acá\nDe los 46 del sistema, los que se graban con lo que hay: **producto en primer plano con la mano entrando** · **pantalla partida A vs B** · **cronómetro en pantalla** · **el comentario real en pantalla** (formato ¿sirve para X?) · **error visual deliberado** (la esponja de acero rayando) · **texto que entra con flecha señalando la mancha**."}, {"id": "g_cta_01", "capitulo": "cta", "orden": 1, "titulo": "Los CTAs: uno solo, y con palabra clave", "contenido": "**Uno solo por pieza. Dos equivalen a ninguno.** Y **\"seguime para más\" no vende**: sirve para crecer, nunca como cierre de una pieza de venta.\n\n## Los de Purexis, por objetivo\n| Objetivo | CTA | Cuándo |\n|---|---|---|\n| **Vender** | *\"Comentá LIMPIEZA y te mando el descuento por privado\"* | el más fuerte, si existe el descuento |\n| **Capturar sin descuento** | *\"Comentá LIMPIEZA y te paso dónde conseguirlo\"* | mientras el descuento no exista |\n| **Alcance** | *\"Mandáselo a quien tiene el baño así\"* | piezas de imán |\n| **Guardado** | *\"Guardalo y hacé la prueba antes de comprar\"* | siempre con momento de uso, nunca \"guardalo para después\" |\n| **Discusión** | *\"¿Vos qué usás, lavandina o vinagre?\"* | pregunta cerrada con opciones |\n\n**Los CTA con más de una opción de respuesta rinden más que las preguntas abiertas.** *\"¿Qué opinás?\"* no lo contesta nadie.\n\n## La palabra clave\nToda pieza de venta cierra con una palabra para comentar o mandar por mensaje. Es señal de intención alta y poca fricción. Vale más que un link: el link saca gente de la app y Instagram te recomienda menos.\n\n⚠️ Sin una herramienta que responda sola (ManyChat o similar), cada palabra hay que contestarla a mano. Con volumen se vuelve impracticable: hay que resolverlo antes de que el volumen llegue.\n\n## Por tipo de pieza\n- **Prueba:** capturar (*\"comentá X\"*).\n- **Imán:** alcance (*\"mandáselo a…\"*). Cero venta.\n- **Filtro:** discusión.\n- **Oferta:** vender, directo.\n- **Serie:** prometer el próximo capítulo. *\"En una semana la muestro otra vez.\"*"}, {"id": "g_cta_02", "capitulo": "cta", "orden": 2, "titulo": "La ventana de 125 caracteres", "contenido": "Instagram muestra **solo los primeros 125 caracteres** del caption antes de cortar con \"… más\".\n\n> **La línea 1 no es la introducción del caption. Es el 90% del caption.**\n\nSi no gana el toque en \"más\", el resto no existe.\n\n## Cómo se gana ese toque\nLa línea 1 hace **una** de estas cuatro cosas, nunca dos:\n\n| Familia | Ejemplo |\n|---|---|\n| **Dolor** ← la que más rinde en producto | *\"Le pasás vinagre y a la semana está igual.\"* |\n| **Curiosidad** | *\"Dos cosas que casi nadie sabe del moho.\"* |\n| **Promesa audaz** | *\"Tres años de sarro, una pasada.\"* |\n| **Historia** | *\"Cerrás la puerta del baño cuando viene gente, ¿no?\"* |\n\nEn producto físico **la de dolor gana casi siempre**: el que mira ya sabe que tiene el problema.\n\n## Lo que nunca va en la línea 1\n- Carraspeo: *\"Bueno,\"*, *\"Hoy les traigo\"*, *\"En este video\"*, *\"¿Sabías que…\"*\n- El nombre del producto. No le importa a nadie que todavía no lo conoce.\n- La marca.\n- Emojis al principio. Roban caracteres de la ventana.\n\n**El error más caro y más común:** enterrar la mejor línea en el sexto párrafo. Si al releer encontrás una frase mejor que la primera, **esa era la primera**."}, {"id": "g_cta_03", "capitulo": "cta", "orden": 3, "titulo": "Los 6 bloques del caption", "contenido": "```\n1 · LA ESCENA            la línea 1. En las palabras del avatar, no en las nuestras\n2 · EL DATO NO OBVIO     por qué le venía pasando. Es lo que separa vender de publicar\n3 · EL PRODUCTO          recién acá aparece el nombre, y en una línea\n4 · EL NÚMERO            tiempo de acción, cuántas pasadas, dónde se usó\n5 · EL DESCALIFICADOR    dónde NO funciona\n6 · CTA                  uno solo, con palabra clave\n```\n\n## El bloque 5: el descalificador honesto\nDecir dónde el producto no sirve es lo que vuelve creíble todo lo anterior.\n\n> *\"Si tu grifería ya está picada y no manchada, ahí no es sarro y esto no te lo va a arreglar.\"*\n> *\"Si tu extractor no anda, el moho vuelve igual. Te lo digo antes de venderte nada.\"*\n\nEs contraintuitivo y es la jugada de mayor retorno del caption. En esta categoría la sospecha de estafa es la objeción número uno: el comentario más votado de la competencia es literalmente *\"no compren\"*. Un caption que solo promete se lee como estafa.\n\n## La fórmula: PAS\n```\nPROBLEMA     \"Lo limpiás, queda blanco, y a las tres semanas está negro otra vez.\"\nAGITACIÓN    \"Y cada vez vuelve peor, porque la esponja te rayó el cromo.\"\nSOLUCIÓN     \"10 segundos y una pasada suave.\"\n```\nLa agitación se hace con un dato, no con adjetivos.\n\n## Forma\n- Frases cortas y muchos saltos de línea. Un bloque compacto no se lee en un teléfono.\n- Medio (150 a 220 palabras) es el estándar de producto. Corto (3 a 5 líneas) para imán y ASMR.\n- 5 hashtags de nicho, no 30 genéricos.\n- Se lee en voz alta antes de publicar. Si tropezás, se reescribe."}, {"id": "g_cta_04", "capitulo": "cta", "orden": 4, "titulo": "Los tres captions especiales", "contenido": "## El caption de serie\nEl formato más subestimado. Construye una cuenta que se sigue en vez de videos sueltos.\n```\nPasaron siete días desde que limpié esta junta. No la volví a tocar.\n[qué se ve]\nEl video de la limpieza está en el perfil.\nEn una semana la muestro otra vez.\nCTA\n```\n**Cada caption cierra el loop anterior y abre uno nuevo.** En productos donde la objeción es *\"¿pero vuelve?\"*, la serie es la única respuesta que existe.\n\n## El caption de seguidores\nPara piezas de tendencia y satisfacción visual, donde el objetivo no es vender. Ese video trae gente que **todavía no tiene el problema**; pedirle que compre es pedirle demasiado.\n1. Confirmar la pertenencia: *\"Hay gente que ve esto y sigue scrolleando. Vos no.\"*\n2. Explicar qué es la cuenta, nombrando varias superficies.\n3. Prometer el próximo video: *\"Seguime, que el próximo es el rincón de la ducha donde no entra ni el cepillo.\"*\n**Cero venta.** Ni link, ni precio, ni palabra clave.\n\n## El caption ancla\nCuando un reel explota, la mayoría de los que llegan no tienen idea de quién sos. Sin esto, un viral trae vistas y cero ventas. Es largo y se repite casi igual debajo de las piezas de alcance:\n1. Presentación asumiendo que sos nuevo\n2. Qué hace el producto, en lenguaje llano\n3. La objeción principal, matada de entrada: *\"¿es real o es otro video hecho con IA?\"*\n4. Prueba numérica: hogares, pedidos, días\n5. Descalificador honesto\n6. CTA con palabra clave"}, {"id": "g_carruseles_01", "capitulo": "carruseles", "orden": 1, "titulo": "La estructura de 10 slides", "contenido": "Un carrusel se lee o no se lee en la portada. Y se guarda o no se guarda en el slide 9.\n\n| Slide | Trabajo |\n|---|---|\n| **1 · Portada** | gana el swipe. Una promesa específica, un contraste, o la escena del avatar. Cero logo grande |\n| **2 · Rehook** | vuelve a enganchar al que pasó la portada. Reencuadra o sube la apuesta |\n| **3 a 7 · Cuerpo** | una idea por slide. Cada slide termina con algo que pide el siguiente |\n| **8 · El pago** | el dato más fuerte, la revelación. Lo que vino a buscar |\n| **9 · El guardado** | el resumen en una imagen: la lista, la tabla, el paso a paso. Es lo que se guarda |\n| **10 · CTA** | uno |\n\n## Los mecanismos de retención entre slides\n- **La frase cortada:** el slide termina a mitad de una idea que se completa en el siguiente.\n- **La numeración visible:** *\"3 de 7\"*. Saber cuánto falta mantiene.\n- **La pregunta al pie:** *\"¿y la mampara?\"* → siguiente slide.\n- **El contraste visual:** antes en un slide, después en el siguiente.\n- **La promesa diferida:** *\"la tercera es la que nadie te dice\"* en el slide 2, se cumple en el 8.\n\n## Adaptación a producto físico\nEl carrusel de Purexis rinde para dos cosas: **el paso a paso de una superficie** (cómo se limpia el durlock sin arruinarlo) y **la comparación en tabla** (vinagre vs producto: tiempo, lo que saca, lo que no). Para la transformación pura, el reel gana.\n\n## Reglas de diseño de Purexis\nSistema de 9 slides, fuentes y paleta fijas, fotos reales. Cuanto más diseñado, menos creíble: la foto del baño real con texto encima le gana a la plantilla. Ver `03-contenido/carruseles/`.\n\n## Cuándo un carrusel pierde\nCuando el video ya hace el trabajo. Un antes/después brutal en carrusel es un reel desperdiciado."}, {"id": "g_historias_01", "capitulo": "historias", "orden": 1, "titulo": "La regla que ordena todo: alternar", "contenido": "> **El error del 99% es convertir las historias en un local de ventas.** Vender todos los días espanta. Dejan de mirar. Y ahí aparecen las pocas visitas.\n\nSi Purexis tiene pocas visitas en historias, no es el algoritmo. Son las historias.\n\n**Ritmo:** venta → uno o dos días de prueba, cotidiano y conversación → venta.\n\nLo contraintuitivo: **la secuencia que vende no es la de venta, es la de antes.** Sin la confianza construida los días previos, la secuencia de venta mejor armada del mundo no convierte.\n\n## La mezcla 40 / 30 / 20 / 10, por día\n| % | Bloque | Qué es | La métrica |\n|---|---|---|---|\n| **40%** | PRUEBA | el producto actuando en vivo, en una casa real | respuestas de \"¿dónde lo compro?\" |\n| **30%** | PERSONA | la mesa, el auto, el depósito, el error del día, la cara | que sigan mirando mañana |\n| **20%** | INTERACCIÓN | encuestas, cajitas, \"¿sirve para X?\", votaciones | densidad de interacción |\n| **10%** | OFERTA | precio, link, descuento, envío | clics y ventas |\n\nSi un día OFERTA se comió el 40%, ese día se rompió el sistema.\n\n## Las historias son fotos\nFoto sacada con el teléfono, a mano. El video y el trípode son del reel. Tres excepciones de video: el spray actuando, el paño arrastrando, el agua corriendo. Con audio ambiente."}, {"id": "g_historias_02", "capitulo": "historias", "orden": 2, "titulo": "La espera: la ventaja injusta de Purexis", "contenido": "El producto necesita actuar. Hay que rociar y esperar.\n\n**En un reel eso es un problema:** hay que comprimir el tiempo, y comprimir el tiempo es lo que hace que parezca truco. Es la razón por la que a la competencia le escriben *\"me da cosa porque están hechos con IA\"*.\n\n**En historias la espera es el activo más grande de la marca.** El tiempo muerto se convierte en:\n- una **encuesta corriendo** (*\"¿sale o no sale?\"*) que transforma al que mira en apostador\n- **conversación** mientras se espera: se contestan cajitas, se muestra la casa\n- una **razón para volver** a mirar en dos horas\n- y sobre todo: **la prueba de que no hay corte**, porque el que mira ve pasar el tiempo real con vos\n\n**Nadie en la categoría está haciendo esto.** Purewall no tiene con qué: no tiene cara, no tiene casa y no tiene mano. Es la secuencia héroe de Purexis.\n\n## Las 8 secuencias\n1. **La apuesta** · la secuencia héroe: rociar, encuesta, esperar, mostrar.\n2. **El buzón** · \"¿sirve para X?\" con la cajita, se contesta en historias.\n3. **El paquete** · la logística a la vista: el envío, la caja, el correo.\n4. **La mesa** · personalidad. La casa, el mate, el error del día.\n5. **El espejo** · dolor y deseo: la escena del avatar.\n6. **Testimonio** · el mensaje de un cliente, con permiso.\n7. **CTA directo** · precio, link. Solo después de las anteriores.\n8. **Rebaño** · \"ya lo pidieron X personas esta semana\". Solo con número real.\n\nEl detalle de cada una, toma por toma, está en la skill `historias-purexis`."}, {"id": "g_historias_03", "capitulo": "historias", "orden": 3, "titulo": "Las 12 reglas de naturalidad", "contenido": "Las historias tienen que parecer que las sube una persona, no un equipo. En cuanto se nota la mano ajena se rompe la conexión. Y en esta marca, **cuanto más diseñada está la pieza, menos creíble es.**\n\n1. **Foto con el teléfono, a mano.** Que salga apenas torcida está bien: es la firma anti-IA.\n2. **Tipografía nativa de Instagram.** Nada de fuentes de marca.\n3. **Nada hecho en Canva.** Si hay que poner un dato, se escribe a mano sobre la pantalla.\n4. **Sin plantilla ni marco.** Ni un elemento que se repita idéntico entre historias: la intercambiabilidad es lo que delata la producción.\n5. **Luz de la casa.** Nunca aro de luz.\n6. **Audio ambiente en los videos:** el agua, el spray, el paño. Nunca música de stock sobre una prueba.\n7. **Poco texto por historia.** Una idea por pantalla.\n8. **Alternar formatos.** Selfie, superficie, captura, encuesta, contexto. Nunca cinco con el mismo encuadre.\n9. **Subrayar la palabra clave** con color. Una sola palabra.\n10. **Repartir en el día.** Bloques de 3 a 5, dos o tres veces. Nunca las 12 juntas a las 21.\n11. **No corregir los errores chicos.** Un dedo mal puesto, un \"eeh\". Eso es lo que no puede fabricar una IA.\n12. **El desorden se deja.** La casa perfecta rompe la identificación.\n\n**Preguntas de control:** ¿esto lo podría haber generado una IA? ¿podría ser de cualquier otra marca si le saco el logo? Si alguna da sí, se rehace.\n\n## Las destacadas, en orden\n`clientes` · `cómo se usa` · `envíos` · `¿sirve para?` · `quiénes somos` · `cómo comprar`. El orden importa: el que llega nuevo mira las dos primeras."}, {"id": "g_historias_04", "capitulo": "historias", "orden": 4, "titulo": "Los mecanismos que llevan al mensaje", "contenido": "## La escalera pregunta → DM\nToda interacción pública sube un escalón hacia el privado: **encuesta → cajita → respuesta al DM → link**. Instagram lee el DM como señal de relación y te empieza a poner primero en la bandeja. **Nunca pedir el clic en la primera historia de una secuencia.**\n\n## Link vs palabra clave\nEl link tiene menos fricción, pero saca gente de la app y Instagram te recomienda menos. Preferir palabra clave. Si se usa link, va **al final** de una secuencia que abrió con algo cotidiano, y no todos los días.\n\n## El seguimiento a las 12 a 24 horas\nAl que respondió y no compró se le escribe una vez, al día siguiente, con **una sola pregunta corta**: *\"¿pudiste hacer la prueba de la junta? ¿te dio sucia o rota?\"* Es la táctica de mayor retorno del sistema y prácticamente nadie la hace. Menos de 80 palabras.\n\n## Efecto rebaño\n*\"Esta semana lo pidieron 14 personas.\"* Solo con el número real. Un rebaño inventado es la mentira más fácil de detectar.\n\n## Urgencia\nSolo la real: el lote que se termina, el envío que cierra el jueves. La urgencia inventada se nota y quema la siguiente.\n\n## Tangibilizar\nQue el producto se vea en una mano, en una mesa, al lado de algo cotidiano que dé la escala. Nunca solo, flotando."}, {"id": "g_dm_01", "capitulo": "dm", "orden": 1, "titulo": "El mapa: de la consulta a la venta en 4 pasos", "contenido": "Un mensaje es la señal de intención más cara que existe. Y se pierde por dos cosas: **por tardar** y **por no seguir**.\n\nDos datos que ordenan todo lo que sigue:\n- **Más de la mitad de las conversaciones mueren antes del tercer mensaje.**\n- **Un solo seguimiento duplica las ventas.** Sin seguimiento perdés la mitad de las que ya tenías ganadas.\n\n## Los 4 pasos\n```\n1 · ABRIR       en menos de 5 minutos si estás; siempre el mismo día\n2 · CALIFICAR   UNA pregunta: ¿qué superficie? / ¿qué probaste?\n3 · CONVERTIR   la respuesta específica + el descalificador + precio + cómo comprar. En UN mensaje\n4 · SEGUIR      a las 24 hs, una pregunta corta. A las 72, la última\n```\n\n## Por qué una sola pregunta para calificar\nPorque la respuesta te dice todo: la superficie te dice qué producto y qué descalificador, y lo que probó te dice qué dato no obvio darle (*\"claro, el vinagre necesita toda la noche\"*). Dos preguntas seguidas se sienten formulario y la gente se va.\n\n## Formato\n- **Menos de 80 palabras por mensaje.** Nunca un bloque.\n- Voseo. Como le escribirías a alguien que conocés.\n- Cero emojis de relleno. Uno si marca algo.\n- Nunca contestar *\"hola\"* con *\"hola\"*. Se abre con la pregunta.\n\n## Lo que se anota\n**Cada conversación que no cierra se anota como interesado en la pieza que la generó**, en el panel. Así el diagnóstico te dice si el problema es el contenido (nadie pregunta) o el cierre (preguntan y no compran). Sin ese dato, las dos fallas se ven iguales y se arreglan en lugares distintos."}, {"id": "g_dm_02", "capitulo": "dm", "orden": 2, "titulo": "Los guiones de respuesta", "contenido": "Plantillas para arrancar. Se adaptan al tono de la persona: si escribe corto, se contesta corto.\n\n## Cuando llega la palabra clave (LIMPIEZA, MOHO, etc.)\n> *\"Buenas! Te paso todo. Antes una cosa para no mandarte cualquiera: ¿es para juntas, mampara, techo o qué superficie?\"*\n\nAbre con la pregunta. No con el link.\n\n## Cuando pregunta directo \"¿sirve para X?\"\n> *\"Sí, para [superficie] va bien. Lo que tenés que saber: [el descalificador honesto]. Si es tu caso, te cuento cómo se usa.\"*\n\nEl descalificador **antes** del precio. Es lo que hace creíble el sí.\n\n## Presentar el precio\n> *\"Sale $[X], con envío a [zona] en [días]. Para que tengas la referencia: [el ancla]. ¿Te lo mando?\"*\n\nEl ancla es contra la alternativa real, no contra otro producto: *\"cambiar la mampara sale diez veces eso\"*, *\"son veinticinco minutos de rodillas cada sábado que te ahorrás\"*. Nunca se baja el precio en el DM.\n\n## Cierre\n> *\"Dale. Te mando el link de pago acá: [link]. Cualquier duda con el pago me escribís.\"*\n\nUn link, una acción. No tres opciones de pago en un párrafo.\n\n## Seguimiento a las 24 hs (si no contestó o no compró)\n> *\"¿Pudiste ver lo de la [superficie]? Si te quedó alguna duda te la contesto.\"*\n\nUna pregunta. Sin presión. Sin repetir el precio.\n\n## Seguimiento a las 72 hs (el último)\n> *\"Te dejo esto por si sirve más adelante: [el video de la superficie]. Cualquier cosa acá estoy.\"*\n\nSe cierra con valor, no con insistencia. Después de este, no se escribe más."}, {"id": "g_dm_03", "capitulo": "dm", "orden": 3, "titulo": "Las 6 objeciones de esta categoría y cómo se contestan", "contenido": "Las objeciones de Purexis no son las de cualquier producto. Salen de los comentarios reales de la competencia, y cada una tiene una respuesta que ya está pensada.\n\n## 1 · \"¿Es real o es IA?\"\nLa objeción número uno de la categoría. Se contesta con prueba, no con palabras.\n> *\"Es real, y es la razón por la que grabo todo en una toma sin corte. Mirá esta: [link a la toma única]. Si querés, la próxima que haga la subo a historias en vivo con la espera.\"*\n\n## 2 · \"¿Y vuelve?\"\nNunca prometer que no vuelve. Prometer la prueba.\n> *\"Te saca la mancha. Que no vuelva depende de la ventilación: si el extractor no anda, en unos meses vuelve, con este o con cualquiera. Te lo digo antes de que me lo compres. Esta junta la limpié hace [X] días y la sigo mostrando: [link a la serie].\"*\n\n## 3 · \"Está caro\"\nAnclar contra la alternativa real. Nunca bajar el precio.\n> *\"Entiendo. La referencia que uso: [cambiar la mampara / el plomero / el sábado de rodillas] sale [X]. Esto es una pasada y te dura [N] aplicaciones. Si igual no te cierra, no pasa nada.\"*\n\nEl *\"no pasa nada\"* no es rendirse: es sacar la presión, y es lo que hace que muchos vuelvan.\n\n## 4 · \"¿Sirve para [superficie]?\"\nLa respuesta exacta, con el descalificador. **Si no sirve, decirlo.** Vende más de lo que pierde: el que igual compra confía, y el que no compra no iba a quedar contento.\n> *\"Para [superficie] sí. Ojo con esto: [descalificador]. Si tu caso es ese, no te sirve y prefiero decírtelo.\"*\n\n## 5 · \"¿Llega a mi zona? ¿Cuánto tarda?\"\nDato concreto. Si no lo sabés, se averigua y se contesta en el día. *\"Creo que sí\"* pierde la venta.\n\n## 6 · \"Lo pienso\"\nNo insistir. Dejar una puerta y el seguimiento a las 24 hs.\n> *\"Dale, sin drama. ¿Qué es lo que te hace dudar, así te lo contesto ahora?\"*\n\nEsa pregunta destapa la objeción real, que casi nunca es \"lo pienso\".\n\n## Cuando se repite la misma objeción\nSi en diez conversaciones cinco preguntan lo mismo, **esa objeción es el próximo reel.** Se responde en contenido, antes de que la hagan."}, {"id": "g_dm_04", "capitulo": "dm", "orden": 4, "titulo": "Setter y closer: quién hace qué", "contenido": "En una marca de ticket alto, el setter abre y califica y el closer vende en una llamada. **En Purexis, con este ticket, la venta se cierra en el mismo chat.** La división no es por persona, es por momento:\n\n| Momento | Rol | Qué hace | Qué no hace |\n|---|---|---|---|\n| Pasos 1 y 2 | **Setter** | abre rápido, hace la única pregunta, manda la info | no discute precio, no promete lo que no sabe |\n| Pasos 3 y 4 | **Closer** | responde la objeción, ancla el precio, manda el link, sigue a las 24 hs | no baja el precio, no insiste más de dos veces |\n\nSi una sola persona hace todo, igual sirve pensarlo así: **primero entendé, después vendé.** El error más común es vender en el primer mensaje.\n\n## Si alguien más contesta los mensajes\nTiene que tener a mano: esta guía · la lista de precios y zonas de envío actualizada · el link de pago · los descalificadores por superficie · el link a la toma única de cada producto.\n\nY una regla: **si no sabe, dice \"te averiguo y te contesto hoy\"**, y lo hace. Inventar una respuesta sobre el producto es la única falta grave.\n\n## Lo que se mide\n- Tiempo de primera respuesta.\n- Conversaciones abiertas / cerradas por semana.\n- Cuántas cerraron con seguimiento vs sin seguimiento.\n- Qué objeción se repitió más. Esa va a contenido.\n\nEl panel te lo muestra en Métricas: *\"De la conversación a la venta\"*. Si cerrás menos del 20% de las conversaciones, el problema está en este capítulo, no en los reels."}, {"id": "g_dm_05", "capitulo": "dm", "orden": 5, "titulo": "Lo que no se hace en un mensaje", "contenido": "- **Mandar el link de entrada.** Sin la pregunta previa, el link se lee como spam.\n- **Un bloque de texto.** Más de 80 palabras no se lee en un teléfono.\n- **Bajar el precio.** Enseña a la gente a pedir descuento. Se ancla, no se baja.\n- **Prometer lo que no está probado.** \"No vuelve nunca más\" es la reseña negativa de dentro de dos meses.\n- **Dos o tres opciones de pago en un párrafo.** Un link, una acción.\n- **Dejar de contestar.** Un mensaje sin responder por 48 horas es una venta perdida y una opinión formada.\n- **Insistir más de dos veces.** Después del seguimiento de las 72 horas, no se escribe más.\n- **Contestar \"hola\" con \"hola\".** Se abre con la pregunta.\n- **Discutir.** Si alguien viene enojado por una compra, se resuelve, no se argumenta. Un problema resuelto bien es un testimonio."}, {"id": "g_competencia_01", "capitulo": "competencia", "orden": 1, "titulo": "Cómo se analiza un competidor", "contenido": "Se hace al abrir una cuenta nueva, al elegir un diferencial, y **cada 2 a 4 semanas** para ver qué cambió. No se copia; se lee dónde está el hueco.\n\n## Los 5 pasos\n1. **Inventario de formatos.** Qué tipos de pieza publica y con qué frecuencia. ¿Hay alguno que nunca hace? Ahí suele estar el hueco.\n2. **Sus ganchos, verbatim.** Se transcriben tal cual y se califican con la rúbrica de A+ a F. Un gancho A con un like es un gancho A con distribución muerta: se aprende del gancho, no del resultado.\n3. **La anatomía de su caption.** Dónde gasta la línea 1, dónde entierra la mejor frase, si tiene dato no obvio, cómo cierra.\n4. **El engagement real.** Likes sobre seguidores. Si todo está por debajo del 2%, el alcance es pago y sus ganchos nunca se validaron orgánicamente.\n5. **Los comentarios.** La mina. Se clasifican: confianza · eficacia · fricción de compra · precio · compatibilidad de superficie · uso y seguridad · testimonios. **Cada categoría con volumen es un miedo, un deseo o una objeción del avatar.** Y cada *\"¿sirve para X?\"* sin responder es un reel que podemos hacer nosotros.\n\n## Lo que se saca del análisis\n- **Territorio ocupado:** lo que ellos ya dicen y nosotros no podemos repetir sin quedar como la copia.\n- **El mapa de huecos:** lo que sus clientes piden y ellos no dan.\n- **Ideas derivadas:** un reel por cada hueco.\n\nSe guarda en `05-Compentencia/` y las capturas de sus piezas van a la *Biblioteca* de esta guía con una nota de tres líneas: qué hace bien, qué robamos, qué no."}, {"id": "g_competencia_02", "capitulo": "competencia", "orden": 2, "titulo": "Purewall: qué robarle y qué no", "contenido": "Analizado el 02-sep-2026. `@purewall_arg`, 10.600 seguidores, Mercado Líder Platinum con más de 1.000 ventas.\n\n## El diagnóstico en una línea\n**Purewall no tiene un problema de contenido. Tiene un problema de confianza, y lo escriben sus propios clientes debajo de cada post.** Su comentario más votado es *\"estoy casi seguro de que me estafaron, no compren\"* (10 likes). Le siguen *\"¿es confiable?\"*, *\"pongan el link, no es muy confiable así\"*, y *\"me da cosa porque todos los videos están hechos con IA\"*.\n\n## Su salud\nTodo por debajo del 2% de engagement: el alcance es pago. Su mejor post tiene 103 likes con 10.600 seguidores. **Sus ganchos nunca se validaron orgánicamente: copiarlos sería aprender de algo que no funcionó solo.**\n\n## Lo que nunca hicieron, y es el hueco\n**Ni un solo video de una persona real aplicando el producto en una casa real. Cero.** Todo es render, packshot o IA. Ahí vive Purexis entero.\n\n## Territorio ocupado: lo que NO podemos decir\nYa dicen, con esas palabras y en cinco piezas: *\"el moho puede tener raíz en el material, por eso limpiar la mancha no evita que vuelva\"* y *\"se disuelve, no se raspa\"*. Ese era nuestro reencuadre. **Si salimos diciendo lo mismo, quedamos como la copia barata.** El diferencial de Purexis no puede ser el mecanismo: es la prueba real, la cara, la casa y la mano.\n\n## Lo que sí se roba\n- **La anatomía de su caption largo** (estructura, no palabras).\n- **El ancla de precio contra el gasto mayor:** *\"¿ese amarillo del inodoro ya te hizo pensar en cambiarlo?\"* Excelente jugada.\n- **Cada pregunta sin responder en sus comentarios:** techo, durlock, cortina, mampara, azulejos. Siete personas preguntaron y nadie les contestó en contenido.\n\n## Lo que no se roba\n- Sus claims: *\"mata la raíz\"* está ocupado y es promesa no probable.\n- Su estética de render.\n- Su silencio ante las objeciones."}, {"id": "g_competencia_03", "capitulo": "competencia", "orden": 3, "titulo": "Cómo guardar una referencia", "contenido": "Cada video, anuncio o pieza que valga la pena mirar de nuevo va adjunta a un artículo de esta guía. Dos formas:\n\n**En la Biblioteca** (el último capítulo), si es una referencia suelta.\n\n**Adjunta al capítulo que corresponda**, si ilustra algo: un gancho bueno va en *Ganchos*, un caption bien hecho en *CTAs y captions*, una toma única ajena en *Cómo se arma un video*.\n\n## La nota que va con cada archivo\nTres líneas, siempre las mismas. Sin la nota, el archivo es un archivo; con la nota, es una lección.\n\n1. **Qué hace bien.** Una cosa concreta: el gancho, el cronómetro en pantalla, cómo mata la objeción.\n2. **Qué robamos.** La estructura, no las palabras.\n3. **Qué no.** Lo que en Purexis no va: el render, el claim, la estética.\n\n## Qué guardar\n- Los mejores anuncios de la categoría (los que llevan meses corriendo: si un anuncio lleva tres meses activo, funciona).\n- Las piezas orgánicas de la competencia con más comentarios, no con más likes.\n- Los comentarios en sí. Una captura de un hilo de objeciones vale más que el video.\n- **Nuestras propias piezas que funcionaron**, para reversionar.\n\nPara subir: abrí el artículo, tocá *Editar*, *Adjuntar archivo*. Acepta fotos, videos y PDF."}, {"id": "g_ia_01", "capitulo": "ia", "orden": 1, "titulo": "La regla: la prueba nunca es IA", "contenido": "Esta es la regla dura de la marca y va antes que cualquier otra cosa de este capítulo:\n\n> **Ninguna pieza de Purexis se produce con IA ni con render. Ni una.**\n\n## Por qué\nEl diferencial completo de la marca se apoya en que la prueba sea real. La competencia tiene el alcance, tiene más de mil ventas, y aun así le escriben debajo de cada post *\"me da cosa porque todos los videos están hechos con IA\"*. Ese es el hueco que ocupa Purexis, y **una sola pieza generada lo tira abajo**. Instagram además la etiqueta en público como contenido de IA.\n\n## Qué está prohibido\n- Generar el video del producto actuando.\n- Generar el antes o el después.\n- Generar caras, manos, casas.\n- Fotos de producto generadas o renderizadas para publicar.\n- \"Mejorar\" una toma real con IA de forma que ya no sea la toma (cambiar el fondo, limpiar la superficie digitalmente).\n- Voces clonadas leyendo el guion.\n\n## Qué NO está prohibido\nTodo lo que **no toca la prueba**: pensar, escribir, investigar, revisar, transcribir, subtitular, ordenar. Eso está en el artículo siguiente, y es mucho.\n\nLa pregunta de control ante cualquier uso: **¿el que mira podría creer que lo que ve fue fabricado?** Si la IA tocó lo que se ve, la respuesta es sí y no se usa."}, {"id": "g_ia_02", "capitulo": "ia", "orden": 2, "titulo": "Dónde la IA sí trabaja para vos", "contenido": "Todo lo de acá abajo respeta la regla anterior: la IA piensa y escribe, pero **lo que se ve y se oye es real**.\n\n## Guiones\n- Pedirle **tres variantes del gancho** que ataquen cosas distintas, y que las califique contra los 7 principios.\n- Pedirle que **califique un gancho tuyo** de A+ a F y diga por qué.\n- Pedirle que revise **coherencia interna**: que marque si el guion dice que algo funciona y después que no.\n- Pedirle que **busque el dato no obvio** de una superficie (la química, por qué falla el truco casero). **Vos lo verificás antes de usarlo.** La IA inventa datos con la misma seguridad con que da los ciertos.\n- Pedirle que marque **claims sin validar** contra la lista de esta guía.\n\n## Captions\n- La línea 1 en las cuatro familias (dolor, curiosidad, promesa, historia), para elegir.\n- Que cuente los caracteres de la línea 1.\n- Que arme el caption ancla con los 6 bloques.\n\n## Investigación\n- La química de una mancha, por qué vuelve, qué la empeora.\n- Pegarle los comentarios de un competidor y pedirle el mapa: miedos, deseos, objeciones, huecos.\n- Qué superficies pregunta la gente y nadie responde.\n\n## Mensajes\n- Un borrador de respuesta a una objeción, que después pasás a tu voz.\n- Agrupar diez conversaciones y decir qué objeción se repite.\n\n## Edición\n- **Subtítulos automáticos** (CapCut los hace). Se corrigen a mano: 2 o 3 palabras por pantalla.\n- Limpieza de ruido de audio.\n- Transcribir un video para sacar el guion.\n\n## Análisis\n- El diagnóstico del panel es IA de reglas: no genera nada, lee números contra umbrales y te dice dónde se cae la pieza.\n\n## La skill del espacio\nPara reels orgánicos de Purexis existe `guiones-purexis`, que aplica todo el sistema solo. Para anuncios pagos, `estratega-avatarhype`. Para historias, `historias-purexis`. Para captions, `captions-que-venden`. Se usan pidiendo por nombre."}, {"id": "g_ia_03", "capitulo": "ia", "orden": 3, "titulo": "Cómo pedirle bien", "contenido": "La IA rinde en proporción al brief. Sin brief devuelve lo genérico que cualquier marca de limpieza podría publicar.\n\n## Lo que va siempre en el pedido\n- **El producto y la superficie.** No \"un reel de Purexis\": \"un reel del Quita Sarro para mampara de vidrio\".\n- **El avatar en escena.** No \"mujeres de 30 a 50\": \"la que le pasó vinagre, Cif y esponja verde y el vidrio sigue lechoso, y ya asumió que quedó así\".\n- **Qué probó antes**, con objetos: limón, vinagre, esponja de acero.\n- **El framework por nombre:** PAS, Antes/Después, 3 razones, Desmitificar, Fundador.\n- **Las reglas:** voseo, sin guion largo, tono de persona, un solo CTA, sin claims sin validar.\n\n## Tres pedidos que funcionan\n\n**Para un guion:**\n> *Escribí un guion PAS de 20 segundos del Quita Sarro para mampara. El avatar: le pasó vinagre y Cif y sigue lechosa. Usá el dato de las dos capas (jabón arriba, mineral abajo). Voseo, sin guion largo, tono de alguien que encontró la solución, un solo CTA con palabra clave. Marcá cualquier claim que no puedas verificar. Dame el guion con timestamps y una variante de hook.*\n\n**Para calificar un gancho:**\n> *Calificá este gancho de A+ a F contra los 7 principios (contexto, claridad, contraste, destilación, especificidad, absorción, promesa). Decime qué falla y dame tres reescrituras que ataquen cosas distintas: una la estructura, otra la promesa, otra sumando un número.*\n\n**Para una objeción:**\n> *Un cliente me escribió: \"está caro\". Es el Quita Moho, sale $X. Escribime una respuesta de menos de 80 palabras, en voseo, que ancle contra la alternativa real y no baje el precio. Sin emojis.*\n\n## Lo que hay que revisar siempre en lo que devuelve\n- ¿Metió un guion largo (—)? Se saca.\n- ¿Tuteó? Se corrige.\n- ¿Hay un dato que no sé si es cierto? Se verifica o se saca.\n- ¿Suena a marca (*\"nuestro producto\"*)? Se pasa a persona.\n- ¿Podría ser de cualquier otra marca de limpieza? Se rehace con más escena."}, {"id": "g_ia_04", "capitulo": "ia", "orden": 4, "titulo": "Cómo detectar que algo se ve hecho con IA", "contenido": "Sirve para auditar lo propio antes de publicar. Si algo de esto aparece, se rehace.\n\n## En texto\n- **Guion largo (—).** El delator más visible.\n- **Superlativos sin dato:** \"revolucionario\", \"increíble\", \"mágico\".\n- **Tríadas perfectas** en cada frase: \"rápido, fácil y efectivo\".\n- **Tuteo** en una marca argentina.\n- **Frases que sirven para cualquier producto** si les sacás el nombre.\n- **La estructura demasiado limpia:** intro, tres puntos, cierre. La gente no habla así.\n\n## En imagen y video\n- **La casa perfecta.** Sin cosas, sin desorden, sin vida.\n- **La luz perfecta.** Pareja, sin sombras, de estudio.\n- **La superficie que queda demasiado limpia.** Un después real tiene marcas de agua, un reflejo, algo.\n- **La mano sin contexto:** sin muñeca, sin manga, sin reloj.\n- **Todo centrado y simétrico.**\n- **Intercambiabilidad:** si le sacás el logo y podría ser de otra marca, es plantilla.\n- **La ausencia de errores.** Un dedo mal puesto, un \"eeh\", una foto torcida: eso es lo que la IA no fabrica, y es lo que da confianza.\n\n## La prueba definitiva\nMostráselo a alguien que no sabe de qué marca es y preguntale: **\"¿esto es real?\"** Si duda, no sale."}, {"id": "g_biblioteca_01", "capitulo": "biblioteca", "orden": 1, "titulo": "Cómo se usa la Biblioteca", "contenido": "Acá van los archivos que no pertenecen a un capítulo puntual: anuncios de la competencia, videos de referencia, fotos de superficies, capturas de comentarios, nuestras propias piezas que funcionaron.\n\n## Para subir algo\n1. Creá un artículo nuevo con *Nueva entrada* (o editá uno existente).\n2. Poné un título que diga qué es y de quién: *\"Purewall · anuncio de mampara · sep 2026\"*.\n3. *Adjuntar archivo*. Fotos, videos y PDF.\n4. En el texto, la nota de tres líneas: **qué hace bien · qué robamos · qué no**.\n\n## Qué vale la pena guardar\n- Anuncios que llevan meses activos. Si sigue corriendo, funciona.\n- Piezas orgánicas ajenas con muchos comentarios (no con muchos likes).\n- Hilos de comentarios con objeciones. Valen más que el video.\n- Nuestras tomas únicas que vendieron, para reversionar.\n- Fotos de superficies reales, para tener el banco de \"antes\".\n\n## Qué no\n- Nada generado con IA, ni ajeno ni propio.\n- Referencias sin nota. Un archivo sin la nota de tres líneas es un archivo perdido."}];

/** Markdown mínimo: títulos, negrita, cursiva, código, bloques, citas, listas, tablas. */
function md(src){
  const E=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inl=t=>E(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const L=(src||"").replace(/\r/g,"").split("\n"); const out=[]; let i=0;
  const esBloque=l=>/^(#{1,3} |\||> |- |\d+\. |```)/.test(l);
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push("<pre>"+E(b.join("\n"))+"</pre>");continue;}
    if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length+1;out.push(`<h${n}>${inl(l.replace(/^#+ /,""))}</h${n}>`);i++;continue;}
    if(/^\|/.test(l)){const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);
      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(rows[0]), body=rows.slice(1).filter(r=>!/^\|\s*:?-/.test(r));
      out.push('<div class="wrap"><table class="gt"><thead><tr>'+head.map(c=>`<th>${inl(c)}</th>`).join("")+"</tr></thead><tbody>"
        +body.map(r=>"<tr>"+cells(r).map(c=>`<td>${inl(c)}</td>`).join("")+"</tr>").join("")+"</tbody></table></div>");continue;}
    if(/^> ?/.test(l)&&l.trim()!==""){const b=[];while(i<L.length&&/^> ?/.test(L[i])&&L[i].trim()!=="")b.push(L[i++].replace(/^> ?/,""));out.push("<blockquote>"+b.map(inl).join("<br>")+"</blockquote>");continue;}
    if(/^- /.test(l)){const b=[];while(i<L.length&&/^- /.test(L[i]))b.push(L[i++].slice(2));out.push("<ul>"+b.map(x=>`<li>${inl(x)}</li>`).join("")+"</ul>");continue;}
    if(/^\d+\. /.test(l)){const b=[];while(i<L.length&&/^\d+\. /.test(L[i]))b.push(L[i++].replace(/^\d+\. /,""));out.push("<ol>"+b.map(x=>`<li>${inl(x)}</li>`).join("")+"</ol>");continue;}
    if(l.trim()===""){i++;continue;}
    const b=[];while(i<L.length&&L[i].trim()!==""&&!esBloque(L[i]))b.push(L[i++]);
    out.push("<p>"+b.map(inl).join("<br>")+"</p>");
  }
  return out.join("");
}

const guiaDe=cap=>state.guia.filter(a=>a.capitulo===cap).sort((a,b)=>(a.orden||0)-(b.orden||0));
function guiaBuscar(q){
  const n=normaliza(q); if(!n)return [];
  return state.guia.filter(a=>normaliza(a.titulo+" "+a.contenido).includes(n))
    .sort((a,b)=>(normaliza(b.titulo).includes(n)?1:0)-(normaliza(a.titulo).includes(n)?1:0));
}
const primeraLinea=t=>(t||"").split("\n").map(l=>l.replace(/^[#>*\-\d. `|]+/,"").trim()).find(l=>l.length>20)||"";

function adjuntoCard(a){
  const media=a.tipo==="imagen"?`<img src="${esc(a.url)}" alt="${esc(a.nombre)}" loading="lazy">`
    :a.tipo==="video"?`<video src="${esc(a.url)}" controls preload="metadata"></video>`
    :`<div style="padding:22px;text-align:center;color:var(--muted)">${icon("reportes",26)}</div>`;
  return `<div class="adj-card">${media}<div class="m"><b>${esc(a.nombre)}</b>
    ${a.nota?`<div class="muted" style="margin-top:4px;white-space:pre-line">${esc(a.nota)}</div>`:""}
    <a href="${esc(a.url)}" target="_blank" rel="noopener" style="font-size:11.5px;color:var(--accent-ink);display:inline-block;margin-top:6px">Abrir ↗</a></div></div>`;
}

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px" class="no-print">
        <button class="btn sm" data-gcap="${art.capitulo}">‹ ${esc(cap.nombre)}</button>

        ${next?`<button class="btn sm" data-gart="${next.id}">${esc(next.titulo)} ›</button>`:""}

          <label class="btn sm" style="cursor:pointer">Adjuntar archivo<input type="file" id="g_file" accept="image/*,video/*,.pdf" multiple style="display:none"></label>
          <span id="g_subiendo" class="muted" style="font-size:11.5px"></span>
        </div>
        <div class="muted" style="font-size:11px">Fotos, videos y PDF. Cada archivo lleva una nota: qué hace bien · qué robamos · qué no.</div>
      </div>
    </div>
    <div class="mfoot">
      ${!isNew?`<button class="btn ghost" data-delguia="${a.id}" style="margin-right:auto;color:var(--bad)">Eliminar</button>`:""}
      <button class="btn" data-action="closeModal">Cancelar</button>
      <button class="btn pri" data-saveguia="${isNew?"":a.id}">Guardar</button>
    </div>`);
  pintarAdj();
  document.getElementById("g_file").addEventListener("change",async e=>{
    const files=[...e.target.files]; if(!files.length)return;
    const st=document.getElementById("g_subiendo");
    for(const f of files){
      st.textContent=`Subiendo ${f.name}…`;
      try{ MODAL_ADJ.push(await subirAdjunto(f)); pintarAdj(); }
      catch(err){ st.textContent="No se pudo subir: "+(err.message||err); toast("Error al subir "+f.name); return; }

function pintarAdj(){
  const box=document.getElementById("g_adj"); if(!box)return;
  box.innerHTML=MODAL_ADJ.map((a,i)=>`<div class="adj-row">
    <div class="th">${a.tipo==="imagen"?`<img src="${esc(a.url)}" alt="">`:a.tipo==="video"?"▶":"📄"}</div>
    <div style="flex:1;min-width:0"><b style="font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.nombre)}</b>
      <input data-adjnota="${i}" value="${esc(a.nota||"")}" placeholder="Qué hace bien · qué robamos · qué no" style="margin-top:4px;font-size:12px;padding:6px 8px"></div>
    <button class="iconbtn" data-quitaradj="${i}" title="Quitar">✕</button></div>`).join("")||`<div class="muted" style="font-size:12px">Sin archivos todavía.</div>`;
  box.querySelectorAll("[data-adjnota]").forEach(el=>el.addEventListener("input",()=>{MODAL_ADJ[+el.dataset.adjnota].nota=el.value;}));
}
async function subirAdjunto(file){
  const ruta=`${Date.now()}_${file.name.replace(/[^\w.\-]+/g,"_")}`;
  const {error}=await sb.storage.from("guia").upload(ruta,file,{upsert:false});
  if(error)throw error;
  const {data}=sb.storage.from("guia").getPublicUrl(ruta);
  return {url:data.publicUrl,nombre:file.name,tipo:file.type.startsWith("image/")?"imagen":file.type.startsWith("video/")?"video":"archivo",nota:""};
}
function saveGuia(id){
  const g=x=>document.getElementById(x);
  const data={titulo:g("g_titulo").value.trim()||"Sin título",capitulo:g("g_cap").value,orden:Number(g("g_orden").value)||1,
    contenido:g("g_contenido").value,adjuntos:[...MODAL_ADJ],actualizado:new Date().toISOString()};
  let o;
  if(id){o=state.guia.find(x=>x.id===id);Object.assign(o,data);}
  else{o={id:nid(),...data};state.guia.push(o);}
  DB.upsertGuia(o); closeModal(); guiaArt=o.id; guiaCap=o.capitulo; guiaQ=""; render();
}
function delGuia(id){
  state.guia=state.guia.filter(a=>a.id!==id); DB.deleteGuia(id); closeModal(); guiaArt=null; render();
}
function restaurarGuiaBase(){
  GUIA_BASE.forEach(b=>{
    const ex=state.guia.find(a=>a.id===b.id);
    const o={...b,adjuntos:ex?ex.adjuntos||[]:[],actualizado:new Date().toISOString()};
    if(ex)Object.assign(ex,o); else state.guia.push(o);
    DB.upsertGuia(o);
  });
  try{localStorage.setItem("purexis_guia_sembrada","1");}catch(e){}
  toast("Guía base cargada: "+GUIA_BASE.length+" artículos");
}

/** Bloque de diagnóstico: el veredicto, los números que lo respaldan y qué hacer. */
function diagBloque(it){
  const d=diagnostico(it), n=DIAG_NIVEL[d.nivel];
  const ads=diagAnuncio(it);
  const barras=d.medidas.map(m=>{
    const pasa=m.v>=m.ref, ancho=Math.max(3,Math.min(100,m.v/Math.max(m.ref*2,0.0001)*100));
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px">
        <span class="muted" style="font-weight:600">${m.k}</span>
        <span class="tnum" style="font-weight:700;color:${pasa?"var(--good)":"var(--bad)"}">${pct(m.v)}
          <span class="muted" style="font-weight:500">/ ${pct(m.ref)}</span></span>
      </div>
      <div class="pbar" style="height:6px"><i style="width:${ancho}%;background:${pasa?"var(--good)":"var(--bad)"}"></i></div>
    </div>`;}).join("");

  return `<div class="card pad" style="border-left:3px solid ${n.c};background:${n.bg}22">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <span class="chip" style="background:${n.bg};color:${n.c}">${n.t}</span>
      <b style="font-size:14.5px">${esc(d.titulo)}</b>
    </div>
    <p class="muted" style="font-size:13px;line-height:1.55;margin:9px 0 0">${d.detalle}</p>
    ${d.accion?`<div style="margin-top:11px;padding:11px 13px;background:var(--surface-2);border-radius:9px">
      <div class="eyebrow" style="font-size:10px;margin-bottom:5px">Qué hacer</div>
      <div style="font-size:13px;line-height:1.55">${d.accion}</div></div>`:""}
    ${barras?`<div style="display:grid;gap:9px;margin-top:13px">${barras}</div>`:""}
    ${d.faltan.length?`<div class="muted" style="font-size:11.5px;margin-top:11px">Para el diagnóstico completo falta cargar: <b style="color:var(--warn)">${d.faltan.join(", ")}</b>.</div>`:""}
    ${ads?`<div style="margin-top:13px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="eyebrow" style="font-size:10px;margin-bottom:6px">Como anuncio</div>
      <b style="font-size:13.5px;color:${DIAG_NIVEL[ads.nivel].c}">${ads.titulo}</b>
      <div class="muted" style="font-size:12.5px;line-height:1.5;margin-top:5px">${ads.accion}</div>
    </div>`:""}
  </div>`;
}

/** Chip compacto para la tabla. */
function diagChip(it){
  const d=diagnostico(it), n=DIAG_NIVEL[d.nivel];
  const etiqueta=d.nivel==="sindatos"?"s/d":{gancho:"Gancho",retencion:"Retención",envios:"Envíos",
    cierre:"No cerró",conversion:"No vendió",estructura:"Sin venta",completo:"Completo",alcance:"Poco alcance"}[d.etapa]||n.t;
  return `<span class="chip" style="background:${n.bg};color:${n.c}" title="${esc(d.titulo)}">${etiqueta}</span>`;
}

function tipoChips(tipos){
  if(!tipos||!tipos.length)return `<span class="chip" style="background:var(--surface-3);color:var(--muted-2)">sin tipo</span>`;
  return tipos.map(k=>{const v=TIPOS_REEL[k];return v?`<span class="chip" style="background:${v.bg};color:${v.c}">${v.t}</span>`:"";}).join(" ");
}
Views.ads=()=>{

            <span>Seguidores <b class="tnum" style="color:var(--text)">+${num(it.seguidoresGanados||0)}</b></span>
